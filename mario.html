<!-- УНИВЕРСАЛЬНАЯ ПЛАВАЮЩАЯ КНОПКА ВОЗВРАТА В МЕНЮ -->
<div style="position: fixed; top: 10px; left: 10px; z-index: 99999;">
  <a href="index.html" style="display: flex; align-items: center; gap: 4px; background: rgba(140, 5, 5, 0.95); border: 2px solid #ff6b55; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-family: monospace; font-size: 11px; font-weight: bold; box-shadow: 0 0 15px rgba(255,0,0,0.7); -webkit-tap-highlight-color: transparent;">

  </a>
</div>
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RETRO PLATFORMER — TG MINI APP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{padding:4px;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 0,#29105f 0%,#070922 35%,#010208 85%);}

.arcade{width:min(900px,100%);height:100%;max-height:550px;overflow:hidden;border:3px solid #151a32;border-radius:16px;background:#070a15;box-shadow:0 0 0 2px #292e4c,0 0 40px #153cff55;display:flex;flex-direction:column;}

.marquee{padding:6px 12px;display:flex;justify-content:space-between;align-items:center;background:radial-gradient(circle at 20% 50%,#692cff55,transparent 20%),#070925;border-bottom:3px solid #121936;}
.marquee h1{margin:0;font-size:clamp(14px,3vw,18px);color:#ffd52c;text-shadow:2px 2px #e52225;}
.stats{display:flex;gap:12px;font-size:11px;color:#20eaff;}
.stats b{color:#fff;}

.screen-wrapper{flex-grow:1;position:relative;background:#05070e;overflow:hidden;display:flex;justify-content:center;align-items:center;}
canvas{position:absolute;inset:0;width:100%;height:100%;background:#03050c;}

/* УПРАВЛЕНИЕ: СЛЕВА ДВИЖЕНИЕ, СПРАВА ПРЫЖОК, ВНИЗУ ПАУЗА */
.controls{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:8px 15px;background:#070a18;border-top:3px solid #141c38;}
.group-left{display:flex;gap:10px;}
.ctrl-btn{width:55px;height:50px;border:2px solid rgba(255,255,255,.3);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:20px;display:flex;justify-content:center;align-items:center;user-select:none;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.4);}
.ctrl-btn:active{background:rgba(32,232,255,.35);border-color:#20e8ff;transform:scale(0.95);}
.ctrl-btn.jump{width:85px;background:rgba(0,255,100,.15);border-color:rgba(0,255,100,.4);color:#00ff88;font-weight:bold;}
.ctrl-btn.pause{width:90px;height:35px;font-size:11px;background:linear-gradient(#ff6b55,#8c0505);border-color:#7b1717;font-weight:bold;}

/* OVERLAY */
.overlay{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:#02030be8;}
.overlay.hidden{display:none;}
.card{width:min(340px,90%);padding:18px;border:3px solid #20e8ff;border-radius:12px;background:#060a1bef;text-align:center;box-shadow:0 0 30px #00d9ff55;}
.card h2{margin:0 0 8px;color:#ffd42a;font-size:22px;text-shadow:2px 2px #f22;}
.card p{color:#b8eaff;font-size:12px;line-height:1.4;}
.start-btn{margin-top:12px;width:100%;height:40px;border:2px solid #20e8ff;border-radius:6px;background:#0f2766;color:#fff;font:bold 13px monospace;cursor:pointer;}

.bottom{padding:3px;text-align:center;border-top:2px solid #111a3b;color:#ffd42a;font-size:10px;background:#050716;}
</style>
</head>
<body>
<div class="arcade">
  <div class="marquee">
    <h1>SUPER PLATFORMER</h1>
    <div class="stats">
      <div>LVL: <b id="lvlNum">1</b>/3</div>
      <div>LIVES: <b id="livesNum">3</b></div>
      <div>SCORE: <b id="scoreNum">0</b></div>
    </div>
  </div>

  <div class="screen-wrapper">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>

  <div class="controls">
    <div class="group-left">
      <div class="ctrl-btn" id="btnLeft">◄</div>
      <div class="ctrl-btn" id="btnRight">►</div>
    </div>
    <button class="ctrl-btn pause" id="pauseBtn">ПАУЗА</button>
    <div class="group-right">
      <div class="ctrl-btn jump" id="btnJump">ПРЫЖОК</div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="title">SUPER PLATFORMER</h2>
      <p id="message">Пройди 3 уровня, перепрыгивай пропасти и врагов, доберись до флага!<br><br>Управление: слева ходьба, справа прыжок.</p>
      <button class="start-btn" id="overlayStart">НАЧАТЬ ИГРУ</button>
    </div>
  </div>

  <footer class="bottom">
    🏆 ЛУЧШИЙ СЧЕТ: <span id="bestScore">0</span>
  </footer>
</div>

<script>
"use strict";
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let level = 1;
let lives = 3;
let score = 0;
let running = false;
let paused = false;

let bestScore = Number(localStorage.getItem("platformerBest") || 0);
document.getElementById('bestScore').textContent = bestScore;

// Игрок
let player = {
  x: 50, y: 250, width: 24, height: 32,
  vx: 0, vy: 0, speed: 3.5, jumpForce: -10, grounded: false
};

let keys = { left: false, right: false, jump: false };

// Данные уровней (платформы, ямы, враги, финишный флаг)
const levelsData = {
  1: {
    platforms: [
      {x: 0, y: 350, w: 300, h: 50},
      {x: 380, y: 350, w: 250, h: 50},
      {x: 680, y: 350, w: 300, h: 50},
      {x: 200, y: 250, w: 120, h: 20},
      {x: 450, y: 180, w: 120, h: 20}
    ],
    enemies: [
      {x: 420, y: 326, w: 24, h: 24, vx: 1, minX: 390, maxX: 600}
    ],
    flag: {x: 900, y: 270, w: 20, h: 80},
    worldWidth: 1000
  },
  2: {
    platforms: [
      {x: 0, y: 350, w: 200, h: 50},
      {x: 280, y: 350, w: 180, h: 50},
      {x: 540, y: 350, w: 150, h: 50},
      {x: 770, y: 350, w: 250, h: 50},
      {x: 150, y: 260, w: 90, h: 20},
      {x: 350, y: 190, w: 100, h: 20},
      {x: 580, y: 230, w: 100, h: 20}
    ],
    enemies: [
      {x: 300, y: 326, w: 24, h: 24, vx: 1.5, minX: 290, maxX: 440},
      {x: 600, y: 326, w: 24, h: 24, vx: -1.2, minX: 550, maxX: 670}
    ],
    flag: {x: 950, y: 270, w: 20, h: 80},
    worldWidth: 1050
  },
  3: {
    platforms: [
      {x: 0, y: 350, w: 150, h: 50},
      {x: 230, y: 350, w: 100, h: 50},
      {x: 410, y: 350, w: 120, h: 50},
      {x: 610, y: 350, w: 100, h: 50},
      {x: 790, y: 350, w: 300, h: 50},
      {x: 120, y: 270, w: 80, h: 20},
      {x: 290, y: 200, w: 90, h: 20},
      {x: 470, y: 150, w: 100, h: 20},
      {x: 660, y: 220, w: 80, h: 20}
    ],
    enemies: [
      {x: 250, y: 326, w: 24, h: 24, vx: 2, minX: 240, maxX: 320},
      {x: 430, y: 326, w: 24, h: 24, vx: -1.5, minX: 420, maxX: 520},
      {x: 820, y: 326, w: 24, h: 24, vx: 1.5, minX: 800, maxX: 1000}
    ],
    flag: {x: 1020, y: 270, w: 20, h: 80},
    worldWidth: 1100
  }
};

let currentLevelData = null;
let cameraX = 0;
let winAnimation = false;
let winTimer = 0;

function loadLevel(lvl) {
  level = lvl;
  let data = levelsData[level];
  currentLevelData = {
    platforms: JSON.parse(JSON.stringify(data.platforms)),
    enemies: JSON.parse(JSON.stringify(data.enemies)),
    flag: {...data.flag},
    worldWidth: data.worldWidth
  };
  player.x = 50;
  player.y = 200;
  player.vx = 0;
  player.vy = 0;
  winAnimation = false;
  updateUI();
}

function updateUI() {
  document.getElementById('lvlNum').textContent = level;
  document.getElementById('livesNum').textContent = lives;
  document.getElementById('scoreNum').textContent = score;
}

function startGame() {
  lives = 3;
  score = 0;
  loadLevel(1);
  running = true;
  paused = false;
  document.getElementById('overlay').classList.add('hidden');
}

function nextLevel() {
  if (level < 3) {
    loadLevel(level + 1);
  } else {
    // ПОБЕДА ВСЕХ 3 УРОВНЕЙ
    winAnimation = true;
    winTimer = 0;
    running = false;
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem("platformerBest", bestScore);
      document.getElementById('bestScore').textContent = bestScore;
    }
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('title').textContent = "ПОБЕДА! 🏆";
    document.getElementById('message').innerHTML = `Вы прошли все 3 уровня!<br>Финальный счет: <b>${score}</b><br><br>🎆 УРА! ОВАЦИИ И САЛЮТ! 🎆`;
    document.getElementById('overlayStart').textContent = "ИГРАТЬ СНОВА";
  }
}

function playerDeath() {
  lives--;
  updateUI();
  if (lives <= 0) {
    running = false;
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('title').textContent = "ИГРА ОКОНЧЕНА";
    document.getElementById('message').innerHTML = `Жизни закончились.<br>Счет: <b>${score}</b>`;
    document.getElementById('overlayStart').textContent = "ПОВТОРИТЬ";
  } else {
    player.x = 50;
    player.y = 200;
    player.vx = 0;
    player.vy = 0;
  }
}

// Управление
const bindBtn = (id, k) => {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); keys[k] = true; });
  el.addEventListener('pointerup', e => { e.preventDefault(); keys[k] = false; });
  el.addEventListener('pointerleave', e => { keys[k] = false; });
};

bindBtn('btnLeft', 'left');
bindBtn('btnRight', 'right');
bindBtn('btnJump', 'jump');

document.getElementById('pauseBtn').addEventListener('click', () => {
  if (!running || winAnimation) return;
  paused = !paused;
  const overlay = document.getElementById('overlay');
  overlay.classList.toggle('hidden', !paused);
  if (paused) {
    document.getElementById('title').textContent = "ПАУЗА";
    document.getElementById('message').innerHTML = "Игра приостановлена.";
    document.getElementById('overlayStart').textContent = "ПРОДОЛЖИТЬ";
  }
});

document.getElementById('overlayStart').addEventListener('click', () => {
  if (winAnimation) {
    startGame();
    return;
  }
  if (paused) {
    paused = false;
    document.getElementById('overlay').classList.add('hidden');
  } else {
    startGame();
  }
});

// Игровой цикл
function update() {
  if (!running || paused) return;

  // Движение игрока
  if (keys.left) player.vx = -player.speed;
  else if (keys.right) player.vx = player.speed;
  else player.vx = 0;

  if (keys.jump && player.grounded) {
    player.vy = player.jumpForce;
    player.grounded = false;
  }

  // Гравитация
  player.vy += 0.45;

  player.x += player.vx;
  player.y += player.vy;

  player.grounded = false;

  // Коллизии с платформами
  currentLevelData.platforms.forEach(p => {
    if (player.x < p.x + p.w && player.x + player.width > p.x &&
        player.y < p.y + p.h && player.y + player.height > p.y) {
      
      // Падение сверху
      if (player.vy > 0 && player.y + player.height - player.vy <= p.y + 6) {
        player.y = p.y - player.height;
        player.vy = 0;
        player.grounded = true;
      }
      // Удар снизу
      else if (player.vy < 0 && player.y - player.vy >= p.y + p.h - 6) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
      // Удары с боков
      else if (player.vx > 0) {
        player.x = p.x - player.width;
      } else if (player.vx < 0) {
        player.x = p.x + p.w;
      }
    }
  });

  // Падение в пропасть
  if (player.y > canvas.height) {
    playerDeath();
  }

  // Движение врагов
  currentLevelData.enemies.forEach(e => {
    e.x += e.vx;
    if (e.x <= e.minX || e.x >= e.maxX) e.vx *= -1;

    // Столкновение с игроком
    if (player.x < e.x + e.w && player.x + player.width > e.x &&
        player.y < e.y + e.h && player.y + player.height > e.y) {
      
      // Прыжок врагу на голову
      if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 10) {
        score += 50;
        updateUI();
        e.y = 9999; // Убираем врага
        player.vy = -7; // Отскок
      } else {
        playerDeath();
      }
    }
  });

  // Проверка финиша (Флаг)
  let f = currentLevelData.flag;
  if (player.x < f.x + f.w && player.x + player.width > f.x &&
      player.y < f.y + f.h && player.y + player.height > f.y) {
    score += 200 * level;
    nextLevel();
  }

  // Плавная камера за игроком
  cameraX = player.x - 200;
  if (cameraX < 0) cameraX = 0;
  if (cameraX > currentLevelData.worldWidth - canvas.width) {
    cameraX = currentLevelData.worldWidth - canvas.width;
  }
}

function draw() {
  ctx.fillStyle = '#03050c';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-cameraX, 0);

  // Отрисовка платформ (кирпичный стиль)
  currentLevelData.platforms.forEach(p => {
    ctx.fillStyle = '#b53a14';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.strokeStyle = '#5a1c07';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x, p.y, p.w, p.h);
  });

  // Отрисовка флага
  let f = currentLevelData.flag;
  ctx.fillStyle = '#666';
  ctx.fillRect(f.x + 8, f.y, 4, f.h);
  ctx.fillStyle = '#00ff88';
  ctx.beginPath();
  ctx.moveTo(f.x + 12, f.y);
  ctx.lineTo(f.x + 35, f.y + 15);
  ctx.lineTo(f.x + 12, f.y + 30);
  ctx.fill();

  // Отрисовка врагов (грибы)
  currentLevelData.enemies.forEach(e => {
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(e.x, e.y + 8, e.w, e.h - 8);
    ctx.fillStyle = '#ff3366';
    ctx.beginPath();
    ctx.arc(e.x + e.w/2, e.y + 8, 12, Math.PI, 0, false);
    ctx.fill();
  });

  // Отрисовка игрока (герой в стиле ретро)
  ctx.fillStyle = '#ffd52c';
  ctx.fillRect(player.x, player.y, player.width, player.height);
  ctx.fillStyle = '#e52225'; // Кепка
  ctx.fillRect(player.x + 2, player.y, player.width - 2, 8);

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loadLevel(1);
requestAnimationFrame(loop);
</script>
</body>
</html>
