<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zeitarbeit Tycoon — FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg-grad: linear-gradient(135deg, #050711 0%, #120926 50%, #03040a 100%);
  --portal-bg: rgba(4, 7, 20, 0.92);
  --border-col: rgba(32, 232, 255, 0.4);
  --accent-col: #20e8ff;
  --title-col: #ffd52c;
  --btn-bg: rgba(16, 26, 60, 0.95);
  --btn-hover: rgba(32, 232, 255, 0.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{
  padding:4px;display:flex;justify-content:center;align-items:center;
  background: var(--bg-grad); position: fixed; inset: 0;
}
.portal{
  width: 100%; height: 100%; max-width: 420px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; gap: 6px;
  overflow-y: auto; padding: 8px; z-index: 10;
  background: var(--portal-bg); border: 2px solid var(--border-col);
  border-radius: 12px; box-shadow: 0 0 25px rgba(0,0,0,0.8);
  position: relative;
}
.game-ui-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 8px; width: 100%; flex-shrink: 0; font-size: 11px; }

.clicker-body {
  flex-grow: 1; background: rgba(1,2,6,0.6); border: 2px solid var(--accent-col);
  border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 10px; overflow-y: auto; gap: 8px;
}

.money-display { font-size: 18px; font-weight: bold; color: var(--title-col); text-shadow: 0 0 8px rgba(255,213,44,0.5); }
.cps-display { font-size: 9px; color: var(--accent-col); }

.click-target {
  width: 90px; height: 90px; background: radial-gradient(circle at 35% 35%, #20e8ff, #0a4d59);
  border: 3px solid var(--title-col); border-radius: 50%; display: flex; justify-content: center; align-items: center;
  font-size: 40px; cursor: pointer; box-shadow: 0 0 20px rgba(32,232,255,0.4); transition: transform 0.05s;
  user-select: none;
}
.click-target:active { transform: scale(0.90); background: radial-gradient(circle at 35% 35%, #ffd52c, #b38600); }

.upgrades-list { width: 100%; display: flex; flex-direction: column; gap: 5px; max-height: 180px; overflow-y: auto; padding-right: 2px; }
.upgrade-card {
  display: flex; justify-content: space-between; align-items: center; background: rgba(16, 26, 60, 0.8);
  border: 1px solid var(--border-col); border-radius: 6px; padding: 6px 8px; font-size: 9px; text-align: left; cursor: pointer;
}
.upgrade-card:active { background: var(--btn-hover); }
.upgrade-info { display: flex; flex-direction: column; gap: 2px; }
.upgrade-name { color: var(--title-col); font-weight: bold; }
.upgrade-cost { color: var(--accent-col); }
.upgrade-count { font-size: 11px; font-weight: bold; color: #fff; background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-col); }
</style>
</head>
<body>

<div style="position: fixed; top: 10px; left: 10px; z-index: 99999;">
  <a href="index.html" style="display: flex; align-items: center; gap: 4px; background: rgba(140, 5, 5, 0.95); border: 2px solid #ff6b55; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-family: monospace; font-size: 11px; font-weight: bold; box-shadow: 0 0 15px rgba(255,0,0,0.7); -webkit-tap-highlight-color: transparent;">
    ⬅ МЕНЮ
  </a>
</div>

<div class="portal">
  <div class="game-ui-header">
    <div style="color:var(--title-col); font-weight:bold;">⚡ ZEITARBEIT TYCOON</div>
    <div id="licenseTxt" style="font-size:9px; color:#20e8ff;">Лицензия: Базовая</div>
  </div>

  <div class="clicker-body">
    <div>
      <div class="money-display" id="moneyTxt">0.00 €</div>
      <div class="cps-display" id="cpsTxt">Доход: 0.00 € / сек</div>
    </div>

    <!-- Кликабельный элемент (найм/заказ) -->
    <div class="click-target" onclick="clickMoney(event)">⚡</div>
    <div style="font-size: 8px; color: #83a4c9;">Тапай для поиска клиентов и контрактов!</div>

    <!-- Список апгрейдов (персонал и бюро) -->
    <div class="upgrades-list" id="upgradesList"></div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
let soundEnabled = localStorage.getItem("freezzzSound") !== "false";

let money = Number(localStorage.getItem("zeitarbeitMoney") || 0);
let totalCps = 0;

// Список улучшений (персонал Zeitarbeit)
let upgrades = [
  { id: 'helfer', name: '⚡ Elektrohelfer (Помощник)', cost: 15, cps: 0.5, count: Number(localStorage.getItem("up_helfer") || 0), mult: 1.15 },
  { id: 'elektriker', name: '💡 Geselle (Дипл. Электрик)', cost: 100, cps: 4, count: Number(localStorage.getItem("up_elektriker") || 0), mult: 1.18 },
  { id: 'meister', name: '🛠️ Obermonteur (Мастер)', cost: 1100, cps: 32, count: Number(localStorage.getItem("up_meister") || 0), mult: 1.2 },
  { id: 'bureau', name: '🏢 Büro Stuttgart (Офис)', cost: 13000, cps: 260, count: Number(localStorage.getItem("up_bureau") || 0), mult: 1.22 },
  { id: 'aueg', name: '📜 Лицензия AÜG (Агентство)', cost: 150000, cps: 1400, count: Number(localStorage.getItem("up_aueg") || 0), mult: 1.25 }
];

function haptic() {
  if (soundEnabled && tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
  }
}

function clickMoney(e) {
  money += 1;
  haptic();
  updateUI();
  
  // Анимация при клике (+1 €)
  let rect = e.target.getBoundingClientRect();
  let pop = document.createElement('div');
  pop.textContent = "+1 €";
  pop.style.cssText = `position:fixed; left:${e.clientX}px; top:${e.clientY}px; color:#ffd52c; font-size:12px; font-weight:bold; pointer-events:none; z-index:9999; transition:0.4s ease-out;`;
  document.body.appendChild(pop);
  setTimeout(() => {
    pop.style.transform = "translateY(-30px)";
    pop.style.opacity = "0";
  }, 10);
  setTimeout(() => pop.remove(), 400);
}

function buyUpgrade(index) {
  let up = upgrades[index];
  if (money >= up.cost) {
    money -= up.cost;
    up.count++;
    up.cost = Math.floor(up.cost * up.mult);
    localStorage.setItem("up_" + up.id, up.count);
    haptic();
    updateUI();
  }
}

function calculateCps() {
  totalCps = 0;
  upgrades.forEach(up => {
    totalCps += up.cps * up.count;
  });
}

function updateUI() {
  calculateCps();
  document.getElementById('moneyTxt').textContent = money.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
  document.getElementById('cpsTxt').textContent = `Доход: ${totalCps.toFixed(1)} € / сек («соли» на счет)`;
  
  // Статус лицензии
  let licenseName = "Базовая (Solo)";
  if (upgrades[3].count > 0) licenseName = "Региональный офис";
  if (upgrades[4].count > 0) licenseName = "Полная лицензия AÜG (Baden-Württemberg)";
  document.getElementById('licenseTxt').textContent = "Лицензия: " + licenseName;

  let listHtml = "";
  upgrades.forEach((up, idx) => {
    let currentCost = Math.floor(up.cost);
    let canBuy = money >= currentCost;
    listHtml += `
      <div class="upgrade-card" style="opacity: ${canBuy ? 1 : 0.6};" onclick="buyUpgrade(${idx})">
        <div class="upgrade-info">
          <div class="upgrade-name">${up.name}</div>
          <div class="upgrade-cost">Цена: ${currentCost.toLocaleString()} € (+${up.cps}/сек)</div>
        </div>
        <div class="upgrade-count">${up.count}</div>
      </div>
    `;
  });
  document.getElementById('upgradesList').innerHTML = listHtml;
  
  localStorage.setItem("zeitarbeitMoney", money);
}

// Игровой цикл пассивного дохода (каждую секунду сохранение и прибавление)
setInterval(() => {
  if (totalCps > 0) {
    money += totalCps / 10;
    updateUI();
  }
}, 100);

// Автосохранение каждые 5 секунд
setInterval(() => {
  localStorage.setItem("zeitarbeitMoney", money);
}, 5000);

updateUI();
</script>
</body>
</html>
