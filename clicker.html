<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zeitarbeit Energy Tycoon — FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  /* Палитра в стиле предоставленных иконок: индустриальный синий, стальной, жёлтый (каски/инструмент) */
  --bg-grad: linear-gradient(135deg, #09192b 0%, #112d4e 50%, #06111c 100%);
  --portal-bg: rgba(13, 35, 58, 0.96);
  --border-col: rgba(74, 144, 226, 0.45);
  --accent-col: #4a90e2;
  --title-col: #ffd52c;
  --btn-bg: rgba(18, 48, 80, 0.95);
  --btn-hover: rgba(74, 144, 226, 0.25);
  --glass-bg: rgba(255, 255, 255, 0.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#06111c;color:#fff;font-family:monospace;overflow:hidden;}
body{
  padding:4px;display:flex;justify-content:center;align-items:center;
  background: var(--bg-grad); position: fixed; inset: 0;
}
.portal{
  width: 100%; height: 100%; max-width: 420px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; gap: 5px;
  overflow-y: auto; padding: 8px; z-index: 10;
  background: var(--portal-bg); border: 2px solid var(--border-col);
  border-radius: 12px; box-shadow: 0 0 25px rgba(13, 35, 58, 0.8);
  position: relative;
}

/* ШАПКА */
.game-ui-header { 
  display: flex; justify-content: space-between; align-items: center; 
  padding: 6px 10px; background: var(--btn-bg); border: 1px solid var(--border-col); 
  border-radius: 8px; width: 100%; flex-shrink: 0; font-size: 10px; 
  z-index: 50;
}
.back-btn {
  background: rgba(180, 40, 40, 0.9); border: 1px solid #ff6b55; color: #fff;
  padding: 4px 8px; border-radius: 6px; text-decoration: none; font-weight: bold;
  cursor: pointer;
}

/* ОСНОВНОЙ КОНТЕЙНЕР */
.clicker-body {
  flex-grow: 1; background: rgba(8, 22, 38, 0.8); border: 2px solid var(--accent-col);
  border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 6px 8px; overflow-y: auto; gap: 5px; position: relative;
}

/* ДВОЙНОЙ БЛОК РЕСУРСОВ */
.resources-container {
  display: flex; gap: 6px; width: 100%;
}
.res-box {
  flex: 1; background: var(--glass-bg); border: 1px solid var(--border-col); border-radius: 8px;
  padding: 5px; text-align: center;
}
.res-title { font-size: 7px; color: #a1c4fd; text-transform: uppercase; }
.res-val { font-size: 12px; font-weight: bold; color: var(--title-col); text-shadow: 0 0 6px rgba(255,213,44,0.4); }
.res-sub { font-size: 7.5px; color: var(--accent-col); margin-top: 1px; }

/* КНОПКА ПРОДАЖИ ЭНЕРГИИ */
.sell-energy-btn {
  width: 100%; background: linear-gradient(135deg, rgba(255,213,44,0.18), rgba(74,144,226,0.18));
  border: 1px solid var(--title-col); border-radius: 6px; padding: 5px; color: var(--title-col);
  font-family: monospace; font-size: 9px; font-weight: bold; cursor: pointer; text-align: center;
  transition: transform 0.1s;
}
.sell-energy-btn:active { transform: scale(0.97); background: rgba(255,213,44,0.3); }

/* ИНДИКАТОР НАПОЛНЯЕМОСТИ БАЛАНСА */
.progress-bar-container {
  width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; border: 1px solid rgba(74,144,226,0.3);
}
.progress-bar-fill {
  height: 100%; background: linear-gradient(90deg, #4a90e2, #ffd52c); width: 0%; transition: width 0.2s ease;
}

/* ЦЕНТРАЛЬНАЯ КНОПКА МОЛНИИ */
.click-target-container { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.click-target {
  width: 70px; height: 70px; background: radial-gradient(circle at 35% 35%, #ffd52c, #d39e00);
  border: 3px solid #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center;
  font-size: 32px; cursor: pointer; box-shadow: 0 0 20px rgba(255,213,44,0.5); transition: transform 0.08s ease;
  user-select: none; z-index: 40;
}
.click-target:active { transform: scale(0.85); background: radial-gradient(circle at 35% 35%, #e0b800, #997500); box-shadow: 0 0 10px #ffd52c; }

/* СПИСОК ПРОФЕССИЙ И СТАНЦИЙ */
.upgrades-list { width: 100%; display: flex; flex-direction: column; gap: 4px; max-height: 160px; overflow-y: auto; padding-right: 2px; }
.upgrade-card {
  display: flex; justify-content: space-between; align-items: center; background: rgba(18, 48, 80, 0.85);
  border: 1px solid var(--border-col); border-radius: 6px; padding: 5px 8px; font-size: 9px; text-align: left; cursor: pointer;
  transition: all 0.15s ease; position: relative; overflow: hidden; z-index: 40;
}
.upgrade-card:active { transform: scale(0.98); background: var(--btn-hover); }
.upgrade-info { display: flex; flex-direction: column; gap: 1px; z-index: 2; }
.upgrade-name { color: var(--title-col); font-weight: bold; font-size: 9px; display: flex; align-items: center; gap: 4px; }
.upgrade-desc { font-size: 7px; color: #a1c4fd; }
.upgrade-cost { color: #6bc5ff; font-weight: bold; }
.upgrade-count { font-size: 10px; font-weight: bold; color: #fff; background: rgba(0,0,0,0.5); padding: 3px 7px; border-radius: 4px; border: 1px solid var(--border-col); z-index: 2; }

/* ВСПЛЫВАЮЩИЕ АНИМАЦИИ */
@keyframes floatUp {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-35px) scale(1.2); opacity: 0; }
}
.floating-text {
  position: fixed; color: #ffd52c; font-size: 12px; font-weight: bold; pointer-events: none; z-index: 99999;
  animation: floatUp 0.45s ease-out forwards; text-shadow: 0 0 5px rgba(0,0,0,0.9);
}
</style>
</head>
<body>

<div class="portal">
  <div class="game-ui-header">
    <a href="index.html" class="back-btn">⬅ МЕНЮ</a>
    <div id="licenseTxt" style="color:var(--title-col); font-weight:bold;">🛠️ Zeitarbeit Elektрик</div>
  </div>

  <div class="clicker-body">
    <!-- ДВОЙНЫЕ ШКАЛЫ РЕСУРСОВ -->
    <div class="resources-container">
      <div class="res-box">
        <div class="res-title">Бюджет (€)</div>
        <div class="res-val" id="moneyTxt">0.00 €</div>
        <div class="res-sub" id="cpsTxt">+0.0 €/сек</div>
      </div>
      <div class="res-box">
        <div class="res-title">Энергия (МВт·ч)</div>
        <div class="res-val" id="energyTxt" style="color:#6bc5ff;">0.0 МВт</div>
        <div class="res-sub" id="epsTxt">+0.0 МВт/с</div>
      </div>
    </div>

    <!-- КНОПКА ПРОДАЖИ ЭНЕРГИИ -->
    <button class="sell-energy-btn" onclick="sellEnergy()">⚡ ПРОДАТЬ ЭНЕРГИЮ (1 МВт = 2.50 €)</button>

    <!-- Индикатор наполняемости денег -->
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>

    <!-- ЦЕНТРАЛЬНАЯ КНОПКА С ИКОНКОЙ МОЛНИИ И КАБЕЛЕЙ -->
    <div class="click-target-container">
      <div class="click-target" onclick="clickEnergy(event)">⚡</div>
      <div style="font-size: 7px; color: #a1c4fd;">Тапай для подачи напряжения!</div>
    </div>

    <!-- СПИСОК ПРОФЕССИЙ И ОБЪЕКТОВ ЛЭП -->
    <div class="upgrades-list" id="upgradesList"></div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
let soundEnabled = localStorage.getItem("freezzzSound") !== "false";

let money = Number(localStorage.getItem("zeitarbeitMoney") || 0);
let totalEnergyMWh = Number(localStorage.getItem("zeitarbeitEnergy") || 0);

// Профессии и станции в стиле электрики / ЛЭП
let upgrades = [
  { 
    id: 'helfer', name: '👷‍♂️ Elektrohelfer (Монтажник)', desc: 'Базовый персонал в каске', 
    cost: 15, incomeEur: 0.4, energyMWh: 0.1, count: Number(localStorage.getItem("up_helfer") || 0), mult: 1.15, type: 'worker' 
  },
  { 
    id: 'solar', name: '☀️ Solar-Park (Солнечные панели)', desc: 'Требует рабочих (+1.2 МВт)', 
    cost: 120, incomeEur: 2, energyMWh: 1.2, workersNeeded: 1, count: Number(localStorage.getItem("up_solar") || 0), mult: 1.18, type: 'station' 
  },
  { 
    id: 'wind', name: '🗼 Freileitung (Линия ЛЭП)', desc: 'Опоры высоковольтных сетей', 
    cost: 950, incomeEur: 14, energyMWh: 8.5, workersNeeded: 3, count: Number(localStorage.getItem("up_wind") || 0), mult: 1.20, type: 'station' 
  },
  { 
    id: 'kraftwerk', name: '🎛️ Schaltanlage (Щитовая)', desc: 'Распределительный узел объектов', 
    cost: 12000, incomeEur: 110, energyMWh: 65, workersNeeded: 10, count: Number(localStorage.getItem("up_kraftwerk") || 0), mult: 1.22, type: 'station' 
  },
  { 
    id: 'aueg', name: '⚡ Atomkraftwerk (АЭС Баден)', desc: 'Главная энергетическая станция', 
    cost: 150000, incomeEur: 850, energyMWh: 450, workersNeeded: 35, count: Number(localStorage.getItem("up_aueg") || 0), mult: 1.25, type: 'station' 
  }
];

let audioCtx = null;
function playSound(freq, type='square', duration=0.1) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function haptic(style='light') {
  if (soundEnabled && tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred(style); } catch(e){}
  }
}

function clickEnergy(e) {
  money += 1;
  totalEnergyMWh += 0.2;
  playSound(520, 'triangle', 0.08);
  haptic('light');
  updateUI();

  let pop = document.createElement('div');
  pop.textContent = "+1 € / ⚡";
  pop.className = "floating-text";
  pop.style.left = (e.clientX - 12) + "px";
  pop.style.top = (e.clientY - 20) + "px";
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 450);
}

function sellEnergy() {
  if (totalEnergyMWh < 1) {
    playSound(150, 'sawtooth', 0.15);
    return;
  }
  let earned = totalEnergyMWh * 2.50;
  money += earned;
  totalEnergyMWh = 0;
  playSound(880, 'square', 0.2);
  haptic('heavy');
  updateUI();
}

function buyUpgrade(index) {
  let up = upgrades[index];
  if (money >= up.cost) {
    money -= up.cost;
    up.count++;
    up.cost = Math.floor(up.cost * up.mult);
    localStorage.setItem("up_" + up.id, up.count);
    playSound(720, 'square', 0.15);
    haptic('medium');
    updateUI();
  } else {
    playSound(140, 'sawtooth', 0.2);
  }
}

function calculateStats() {
  let totalEurSec = 0;
  let totalEnergySec = 0;
  let totalWorkers = 0;
  
  upgrades.forEach(up => {
    if (up.type === 'worker') totalWorkers += up.count;
  });

  upgrades.forEach(up => {
    if (up.type === 'worker') {
      totalEurSec += up.incomeEur * up.count;
      totalEnergySec += up.energyMWh * up.count;
    } else if (up.type === 'station') {
      let requiredWorkersTotal = up.workersNeeded * up.count;
      let efficiency = requiredWorkersTotal > 0 ? Math.min(1.0, totalWorkers / requiredWorkersTotal) : 1.0;
      if (totalWorkers === 0 && up.workersNeeded > 0) efficiency = 0.1;

      totalEurSec += (up.incomeEur * up.count) * efficiency;
      totalEnergySec += (up.energyMWh * up.count) * efficiency;
    }
  });

  return { totalEurSec, totalEnergySec, totalWorkers };
}

function updateUI() {
  let stats = calculateStats();
  
  document.getElementById('moneyTxt').textContent = money.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
  document.getElementById('cpsTxt').textContent = `+${stats.totalEurSec.toFixed(1)} €/сек`;
  
  document.getElementById('energyTxt').textContent = totalEnergyMWh.toFixed(1) + " МВт";
  document.getElementById('epsTxt').textContent = `+${stats.totalEnergySec.toFixed(1)} МВт/с`;

  let cheapestCost = Math.min(...upgrades.map(u => u.cost));
  let progressPercent = Math.min(100, (money / cheapestCost) * 100);
  document.getElementById('progressFill').style.width = progressPercent + "%";

  let listHtml = "";
  upgrades.forEach((up, idx) => {
    let currentCost = Math.floor(up.cost);
    let canBuy = money >= currentCost;
    
    let subInfo = `Доход: +${up.incomeEur}€/с, +${up.energyMWh}МВт/с`;
    if (up.type === 'station') {
      subInfo = `Требует кал.: ${up.workersNeeded} раб./шт. | +${up.energyMWh}МВт`;
    }

    listHtml += `
      <div class="upgrade-card" style="opacity: ${canBuy ? 1 : 0.65}; border-color: ${canBuy ? 'var(--title-col)' : 'var(--border-col)'};" onclick="buyUpgrade(${idx})">
        <div class="upgrade-info">
          <div class="upgrade-name">${up.name}</div>
          <div class="upgrade-desc">${subInfo}</div>
          <div class="upgrade-cost">Цена: ${currentCost.toLocaleString()} €</div>
        </div>
        <div class="upgrade-count">${up.count}</div>
      </div>
    `;
  });
  
  document.getElementById('upgradesList').innerHTML = listHtml;
  localStorage.setItem("zeitarbeitMoney", money);
  localStorage.setItem("zeitarbeitEnergy", totalEnergyMWh);
}

// Игровой цикл пассивного прироста
setInterval(() => {
  let stats = calculateStats();
  if (stats.totalEurSec > 0 || stats.totalEnergySec > 0) {
    money += stats.totalEurSec / 10;
    totalEnergyMWh += stats.totalEnergySec / 10;
    updateUI();
  }
}, 100);

// Автосохранение
setInterval(() => {
  localStorage.setItem("zeitarbeitMoney", money);
  localStorage.setItem("zeitarbeitEnergy", totalEnergyMWh);
}, 5000);

updateUI();
</script>
</body>
</html>
