<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minesweeper — FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg-grad: radial-gradient(circle at 50% 20%, rgba(41, 16, 95, 0.9) 0%, rgba(7, 9, 34, 0.95) 50%, rgba(1, 2, 8, 1) 100%);
  --portal-bg: rgba(4, 7, 20, 0.92);
  --border-col: rgba(32, 232, 255, 0.4);
  --accent-col: #20e8ff;
  --title-col: #ffd52c;
  --btn-bg: rgba(16, 26, 60, 0.95);
  --btn-hover: #213c8f;
  --glass-bg: rgba(32, 232, 255, 0.08);
  --neon-glow: rgba(32, 232, 255, 0.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{
  padding:4px;display:flex;justify-content:center;align-items:center;
  background: var(--bg-grad); position: fixed; inset: 0;
}
.portal{
  width: 100%; height: 100%; max-width: 420px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; gap: 6px;
  overflow-y: auto; padding: 8px; z-index: 10;
  background: var(--portal-bg); border: 2px solid var(--border-col);
  border-radius: 12px; box-shadow: 0 0 25px rgba(0,0,0,0.8);
  position: relative;
}
.game-ui-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 8px; width: 100%; flex-shrink: 0; font-size: 11px; }

#gameContainer { flex-grow: 1; width: 100%; position: relative; background: #010206; border: 2px solid var(--accent-col); border-radius: 8px; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 4px; }

/* ИГРОВОЕ ПОЛЕ САПЕРА */
.mine-grid {
  display: grid;
  grid-template-columns: repeat(12, 26px);
  grid-template-rows: repeat(16, 26px);
  gap: 2px;
  background: #0b0d19;
  padding: 4px;
  border-radius: 6px;
  border: 1px solid var(--border-col);
}
.cell {
  width: 26px; height: 26px;
  background: rgba(32, 232, 255, 0.12);
  border: 1px solid var(--border-col);
  border-radius: 3px;
  display: flex; justify-content: center; align-items: center;
  font-size: 12px; font-weight: bold; cursor: pointer; user-select: none;
  transition: background 0.1s;
}
.cell:active { background: rgba(32, 232, 255, 0.3); }
.cell.revealed { background: #050814; border-color: #162240; }
.cell.mine { background: #ff3366; }
.cell.flag { background: rgba(255, 213, 44, 0.2); border-color: var(--title-col); }

/* ПАНЕЛЬ УПРАВЛЕНИЯ РЕЖИМАМИ */
.game-controls { display: flex; gap: 8px; justify-content: center; width: 100%; padding: 4px; flex-shrink: 0; }
.ctrl-btn { 
  background: var(--glass-bg); backdrop-filter: blur(4px);
  border: 2px solid var(--accent-col); color: var(--title-col); 
  font-size: 12px; font-weight: bold; padding: 8px 14px; border-radius: 8px; 
  cursor: pointer; user-select: none; box-shadow: 0 0 10px var(--neon-glow); 
  flex-grow: 1; transition: transform 0.1s;
}
.ctrl-btn.active-mode { background: var(--btn-hover); border-color: var(--title-col); box-shadow: 0 0 15px var(--title-col); }
.ctrl-btn:active { transform: scale(0.95); }
</style>
</head>
<body>

<!-- УНИВЕРСАЛЬНАЯ ПЛАВАЮЩАЯ КНОПКА ВОЗВРАТА В МЕНЮ -->
<div style="position: fixed; top: 10px; left: 10px; z-index: 99999;">
  <a href="index.html" style="display: flex; align-items: center; gap: 4px; background: rgba(140, 5, 5, 0.95); border: 2px solid #ff6b55; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-family: monospace; font-size: 11px; font-weight: bold; box-shadow: 0 0 15px rgba(255,0,0,0.7); -webkit-tap-highlight-color: transparent;">
    ⬅ МЕНЮ
  </a>
</div>

<div class="portal">
  <div class="game-ui-header">
    <div id="minesTxt" style="color:var(--title-col);">МИНЫ: 💣 20</div>
    <div id="statusTxt" style="color:var(--accent-col);">САПЁР РЕТРО</div>
    <button onclick="initGame()" style="background:var(--btn-bg); border:1px solid var(--border-col); color:var(--title-col); padding:3px 8px; border-radius:4px; cursor:pointer; font-size:10px;">🔄 СБРОС</button>
  </div>

  <div id="gameContainer">
    <div class="mine-grid" id="mineGrid"></div>
  </div>

  <div class="game-controls">
    <button class="ctrl-btn active-mode" id="modeOpen" onclick="setMode('open')">⛏️ ОТКРЫТЬ</button>
    <button class="ctrl-btn" id="modeFlag" onclick="setMode('flag')">🚩 ФЛАЖОК</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
let soundEnabled = localStorage.getItem("freezzzSound") !== "false";
function haptic() {
  if (soundEnabled && tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
  }
}

const ROWS = 16;
const COLS = 12;
const MINES = 20;

let grid = [];
let gameOver = false;
let currentMode = 'open'; // 'open' или 'flag'
let flagsLeft = MINES;

function setMode(mode) {
  currentMode = mode;
  haptic();
  document.getElementById('modeOpen').classList.toggle('active-mode', mode === 'open');
  document.getElementById('modeFlag').classList.toggle('active-mode', mode === 'flag');
}

function initGame() {
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(0).map(() => ({
    mine: false,
    revealed: false,
    flagged: false,
    count: 0
  })));
  gameOver = false;
  flagsLeft = MINES;
  document.getElementById('minesTxt').textContent = "МИНЫ: 💣 " + flagsLeft;
  document.getElementById('statusTxt').textContent = "САПЁР РЕТРО";

  // Расстановка мин
  let placed = 0;
  while (placed < MINES) {
    let r = Math.floor(Math.random() * ROWS);
    let c = Math.floor(Math.random() * COLS);
    if (!grid[r][c].mine) {
      grid[r][c].mine = true;
      placed++;
    }
  }

  // Подсчет цифр вокруг мин
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c].mine) continue;
      let count = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          let nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc].mine) {
            count++;
          }
        }
      }
      grid[r][c].count = count;
    }
  }

  renderBoard();
}

function renderBoard() {
  const container = document.getElementById('mineGrid');
  container.innerHTML = '';

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cellDiv = document.createElement('div');
      cellDiv.className = 'cell';
      const cell = grid[r][c];

      if (cell.revealed) {
        cellDiv.classList.add('revealed');
        if (cell.mine) {
          cellDiv.classList.add('mine');
          cellDiv.textContent = '💣';
        } else if (cell.count > 0) {
          cellDiv.textContent = cell.count;
          const colors = ['', '#20e8ff', '#00ff88', '#ff3366', '#b033ff', '#ffd52c', '#ff8800', '#fff', '#888'];
          cellDiv.style.color = colors[cell.count] || '#fff';
        }
      } else if (cell.flagged) {
        cellDiv.classList.add('flag');
        cellDiv.textContent = '🚩';
      }

      // Обработка нажатия на клетку
      cellDiv.addEventListener('click', () => handleCellClick(r, c));
      // Долгое нажатие для быстрого переключения флажка
      cellDiv.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        toggleFlag(r, c);
      });

      container.appendChild(cellDiv);
    }
  }
}

function handleCellClick(r, c) {
  if (gameOver || grid[r][c].revealed) return;

  if (currentMode === 'flag') {
    toggleFlag(r, c);
    return;
  }

  if (grid[r][c].flagged) return; // Нельзя открыть клетку с флажком

  if (grid[r][c].mine) {
    // Поражение
    gameOver = true;
    revealAllMines();
    document.getElementById('statusTxt').textContent = "💥 БУХ! ПОРАЖЕНИЕ";
    haptic();
    return;
  }

  revealCell(r, c);
  renderBoard();
  checkWin();
}

function toggleFlag(r, c) {
  if (gameOver || grid[r][c].revealed) return;
  haptic();
  if (!grid[r][c].flagged && flagsLeft > 0) {
    grid[r][c].flagged = true;
    flagsLeft--;
  } else if (grid[r][c].flagged) {
    grid[r][c].flagged = false;
    flagsLeft++;
  }
  document.getElementById('minesTxt').textContent = "МИНЫ: 💣 " + flagsLeft;
  renderBoard();
}

function revealCell(r, c) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS || grid[r][c].revealed || grid[r][c].flagged) return;
  
  grid[r][c].revealed = true;
  haptic();

  // Если пустая клетка (0), открываем соседей автоматически
  if (grid[r][c].count === 0) {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        revealCell(r + dr, c + dc);
      }
    }
  }
}

function revealAllMines() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c].mine) {
        grid[r][c].revealed = true;
      }
    }
  }
  renderBoard();
}

function checkWin() {
  let won = true;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!grid[r][c].mine && !grid[r][c].revealed) {
        won = false;
        break;
      }
    }
  }
  if (won) {
    gameOver = true;
    document.getElementById('statusTxt').textContent = "🏆 ПОБЕДА!";
    haptic();
  }
}

initGame();
</script>
</body>
</html>
