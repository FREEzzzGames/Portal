<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RETRO MINESWEEPER — FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{padding:6px;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 0,#29105f 0%,#070922 35%,#010208 85%);}
.arcade{width:min(500px,100%);height:100%;max-height:750px;border:3px solid #151a32;border-radius:16px;background:#070a15;display:flex;flex-direction:column;}
.marquee{padding:8px;text-align:center;background:#070925;border-bottom:3px solid #121936;}
.marquee h1{margin:0;font-size:18px;color:#ffd52c;text-shadow:2px 2px #e52225;}
.screen-wrapper{flex-grow:1;position:relative;background:#03050c;display:flex;justify-content:center;align-items:center;padding:10px;}
.grid{display:grid;grid-template-columns:repeat(8, 1fr);gap:3px;width:320px;height:320px;}
.cell{background:#0c1229;border:1px solid #20e8ff55;display:flex;justify-content:center;align-items:center;font-size:16px;font-weight:bold;color:#fff;cursor:pointer;user-select:none;}
.cell.revealed{background:#030612;border-color:#141d3b;}
.overlay{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:#02030be8;}
.overlay.hidden{display:none;}
.card{width:min(320px,90%);padding:18px;border:3px solid #20e8ff;border-radius:12px;background:#060a1bef;text-align:center;}
.card h2{margin:0 0 8px;color:#ffd42a;font-size:20px;}
.card p{color:#b8eaff;font-size:12px;}
.start-btn{margin-top:12px;width:100%;height:40px;border:2px solid #20e8ff;border-radius:6px;background:#0f2766;color:#fff;font:bold 13px monospace;cursor:pointer;}
.bottom{padding:4px;text-align:center;border-top:2px solid #111a3b;color:#ffd42a;font-size:10px;background:#050716;}
</style>
</head>
<body>
<div class="arcade">
  <div class="marquee"><h1>MINESWEEPER 💣</h1></div>
  <div class="screen-wrapper"><div class="grid" id="grid"></div></div>
  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="title">САПЕР</h2>
      <p>Открывай безопасные клетки и не наступи на мину!</p>
      <button class="start-btn" id="startBtn">ИГРАТЬ</button>
    </div>
  </div>
  <footer class="bottom">ЛОГИКА И РАСЧЕТ</footer>
</div>
<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const gridEl = document.getElementById('grid');
const size = 8, minesCount = 10;
let board = [];

function initGame() {
  gridEl.innerHTML = '';
  board = Array(size * size).fill(0);
  let placed = 0;
  while(placed < minesCount) {
    let idx = Math.floor(Math.random() * board.length);
    if (board[idx] !== 'M') { board[idx] = 'M'; placed++; }
  }
  
  for(let i=0; i<board.length; i++) {
    if (board[i] === 'M') continue;
    let r = Math.floor(i / size), c = i % size, count = 0;
    for(let dr = -1; dr <= 1; dr++) {
      for(let dc = -1; dc <= 1; dc++) {
        let nr = r + dr, nc = c + dc;
        if(nr >= 0 && nr < size && nc >= 0 && nc < size && board[nr * size + nc] === 'M') count++;
      }
    }
    board[i] = count;
  }

  for(let i=0; i<board.length; i++) {
    let cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.idx = i;
    cell.addEventListener('click', () => clickCell(i, cell));
    gridEl.appendChild(cell);
  }
}

function clickCell(idx, el) {
  if (el.classList.contains('revealed')) return;
  el.classList.add('revealed');
  if (board[idx] === 'M') {
    el.textContent = '💣';
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('title').textContent = "БУХ! МИНА!";
    document.getElementById('startBtn').textContent = "ЗАНОВО";
  } else {
    if (board[idx] > 0) el.textContent = board[idx];
  }
}

document.getElementById('startBtn').addEventListener('click', () => {
  initGame();
  document.getElementById('overlay').classList.add('hidden');
});
initGame();
</script>
</body>
</html>
