<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RETRO PONG — FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{padding:6px;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 0,#29105f 0%,#070922 35%,#010208 85%);}
.arcade{width:min(500px,100%);height:100%;max-height:750px;border:3px solid #151a32;border-radius:16px;background:#070a15;display:flex;flex-direction:column;}
.marquee{padding:8px;text-align:center;background:#070925;border-bottom:3px solid #121936;}
.marquee h1{margin:0;font-size:20px;color:#ffd52c;text-shadow:2px 2px #e52225;}
.screen-wrapper{flex-grow:1;position:relative;background:#03050c;display:flex;justify-content:center;align-items:center;padding:10px;}
canvas{background:#010206;border:2px solid #20e8ff;border-radius:6px;width:100%;height:100%;object-fit:contain;}
.controls{display:flex;justify-content:space-around;padding:10px;background:#070a18;border-top:3px solid #141c38;gap:10px;}
.ctrl-btn{flex-grow:1;height:55px;border:2px solid rgba(255,255,255,.3);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:20px;display:flex;justify-content:center;align-items:center;user-select:none;cursor:pointer;}
.ctrl-btn:active{background:rgba(32,232,255,.35);border-color:#20e8ff;}
.overlay{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:#02030be8;}
.overlay.hidden{display:none;}
.card{width:min(320px,90%);padding:18px;border:3px solid #20e8ff;border-radius:12px;background:#060a1bef;text-align:center;}
.card h2{margin:0 0 8px;color:#ffd42a;font-size:20px;}
.card p{color:#b8eaff;font-size:12px;}
.start-btn{margin-top:12px;width:100%;height:40px;border:2px solid #20e8ff;border-radius:6px;background:#0f2766;color:#fff;font:bold 13px monospace;cursor:pointer;}
.bottom{padding:4px;text-align:center;border-top:2px solid #111a3b;color:#ffd42a;font-size:10px;background:#050716;}
</style>
</head>
<body>
<div class="arcade">
  <div class="marquee"><h1>RETRO PONG 🏓</h1></div>
  <div class="screen-wrapper"><canvas id="pong" width="400" height="500"></canvas></div>
  <div class="controls">
    <div class="ctrl-btn" id="btnUp">▲ ВВЕРХ</div>
    <div class="ctrl-btn" id="btnDown">▼ ВНИЗ</div>
  </div>
  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="title">PONG</h2>
      <p>Обыграй робота-соперника!<br><br>Управляй ракеткой кнопками внизу.</p>
      <button class="start-btn" id="startBtn">ИГРАТЬ</button>
    </div>
  </div>
  <footer class="bottom">ИГРОК VS РОБОТ</footer>
</div>
<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const canvas = document.getElementById('pong'), ctx = canvas.getContext('2d');
let pScore = 0, bScore = 0, running = false;
let player = {x: 20, y: 200, w: 12, h: 80, score: 0};
let bot = {x: 368, y: 200, w: 12, h: 80, score: 0};
let ball = {x: 200, y: 250, r: 8, vx: 4, vy: 3};
let dir = 0; // -1 вверх, 1 вниз, 0 стоп

function update() {
  if (!running) return;
  player.y += dir * 6;
  if (player.y < 0) player.y = 0;
  if (player.y > canvas.height - player.h) player.y = canvas.height - player.h;

  // ИИ бота
  if (bot.y + bot.h/2 < ball.y) bot.y += 3.5;
  else bot.y -= 3.5;
  if (bot.y < 0) bot.y = 0; if (bot.y > canvas.height - bot.h) bot.y = canvas.height - bot.h;

  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.y - ball.r < 0 || ball.y + ball.r > canvas.height) ball.vy *= -1;

  // Столкновение с игроком
  if (ball.x - ball.r < player.x + player.w && ball.y > player.y && ball.y < player.y + player.h) {
    ball.vx *= -1.05; ball.x = player.x + player.w + ball.r;
  }
  // Столкновение с ботом
  if (ball.x + ball.r > bot.x && ball.y > bot.y && ball.y < bot.y + bot.h) {
    ball.vx *= -1.05; ball.x = bot.x - ball.r;
  }

  if (ball.x < 0) { bot.score++; resetBall(); }
  if (ball.x > canvas.width) { player.score++; resetBall(); }
}

function resetBall() {
  ball.x = canvas.width/2; ball.y = canvas.height/2;
  ball.vx = 4 * (Math.random() > 0.5 ? 1 : -1);
  ball.vy = 3 * (Math.random() > 0.5 ? 1 : -1);
}

function draw() {
  ctx.fillStyle = '#010206'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#20e8ff44'; ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke(); ctx.setLineDash([]);
  
  ctx.fillStyle = '#20e8ff'; ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = '#e52225'; ctx.fillRect(bot.x, bot.y, bot.w, bot.h);
  ctx.fillStyle = '#ffd52c'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#fff'; ctx.font = '20px monospace';
  ctx.fillText(player.score, canvas.width/2 - 40, 30);
  ctx.fillText(bot.score, canvas.width/2 + 25, 30);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

document.getElementById('btnUp').addEventListener('pointerdown', () => dir = -1);
document.getElementById('btnUp').addEventListener('pointerup', () => dir = 0);
document.getElementById('btnDown').addEventListener('pointerdown', () => dir = 1);
document.getElementById('btnDown').addEventListener('pointerup', () => dir = 0);
document.getElementById('startBtn').addEventListener('click', () => {
  player.score = 0; bot.score = 0; resetBall(); running = true;
  document.getElementById('overlay').classList.add('hidden');
});
loop();
</script>
</body>
</html>
