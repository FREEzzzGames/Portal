<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>F1 FORMULA — TG MINI APP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{padding:4px;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 0,#101a3f 0%,#050714 50%,#010206 100%);}

.arcade{width:min(1000px,100%);height:100%;max-height:750px;overflow:hidden;border:3px solid #1a2342;border-radius:16px;background:#070a18;box-shadow:0 0 40px #0a256ff5;display:flex;flex-direction:column;}

.marquee{padding:8px;text-align:center;background:#070a20;border-bottom:3px solid #141c38;}
.marquee h1{margin:0;font-size:clamp(20px,3.5vw,36px);color:#ffd52c;text-shadow:2px 2px #e52225;}
.sub{color:#20eaff;font-size:clamp(9px,1.5vw,13px);font-weight:bold;}

.screen-wrapper{flex-grow:1;position:relative;background:#050712;overflow:hidden;display:flex;justify-content:center;align-items:center;}
canvas{position:absolute;inset:0;width:100%;height:100%;}

/* HUD */
.hud{position:absolute;z-index:10;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none;}
.hudbox{padding:4px 10px;border:2px solid #20e8ff;border-radius:5px;text-align:center;background:#020922dd;box-shadow:0 0 8px #00d9ff44;}
.hudbox small{display:block;color:#20e8ff;font-size:7px;}
.hudbox b{display:block;font-size:14px;}

/* CONTROLS (SEMITRANSPARENT) */
.controls{position:absolute;z-index:20;inset:0;display:flex;justify-content:space-between;align-items:flex-end;padding:15px;pointer-events:none;}
.group{display:flex;gap:10px;pointer-events:auto;}
.ctrl-btn{width:65px;height:65px;border:2px solid rgba(255,255,255,.4);border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px;display:flex;justify-content:center;align-items:center;backdrop-filter:blur(4px);user-select:none;box-shadow:0 0 10px rgba(0,0,0,.5);cursor:pointer;}
.ctrl-btn:active{background:rgba(32,232,255,.35);border-color:#20e8ff;}
.ctrl-btn.gas{background:rgba(0,255,100,.15);border-color:rgba(0,255,100,.4);}
.ctrl-btn.brake{background:rgba(255,50,50,.15);border-color:rgba(255,50,50,.4);}

/* OVERLAY */
.overlay{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:#02030be8;}
.overlay.hidden{display:none;}
.card{width:min(380px,90%);padding:18px;border:3px solid #20e8ff;border-radius:12px;background:#060a1bef;text-align:center;box-shadow:0 0 30px #00d9ff55;}
.card h2{margin:0 0 8px;color:#ffd42a;font-size:22px;text-shadow:2px 2px #f22;}
.card p{color:#b8eaff;font-size:12px;line-height:1.4;}
.start-btn{margin-top:12px;width:100%;height:45px;border:2px solid #20e8ff;border-radius:6px;background:#0f2766;color:#fff;font:bold 14px monospace;cursor:pointer;}

.bottom{padding:5px;text-align:center;border-top:2px solid #111a3b;color:#ffd42a;font-size:12px;background:#050716;}
</style>
</head>
<body>
<div class="arcade">
  <header class="marquee">
    <h1>F1 GRAND PRIX <span>CIRCUIT</span></h1>
    <div class="sub">CHAMPIONSHIP TIME ATTACK</div>
  </header>

  <div class="screen-wrapper">
    <div style="position:relative;width:100%;height:100%;" id="gameArea">
      <canvas id="trackCanvas"></canvas>
      <canvas id="carCanvas"></canvas>

      <div class="hud">
        <div class="hudbox"><small>SPEED</small><b id="hudSpeed">0</b></div>
        <div class="hudbox"><small>LAP</small><b id="hudLap">1/3</b></div>
        <div class="hudbox"><small>TIME</small><b id="hudTime">00.00</b></div>
        <div class="hudbox"><small>BEST</small><b id="hudBest">--.--</b></div>
      </div>

      <!-- CONTROLS -->
      <div class="controls">
        <div class="group">
          <div class="ctrl-btn" id="btnLeft">◀</div>
          <div class="ctrl-btn" id="btnRight">▶</div>
        </div>
        <div class="group">
          <div class="ctrl-btn brake" id="btnBrake">■</div>
          <div class="ctrl-btn gas" id="btnGas">▲</div>
        </div>
      </div>

      <div class="overlay" id="overlay">
        <div class="card">
          <h2 id="title">F1 TIME ATTACK</h2>
          <p id="message">Пройди 3 круга на болиде F1.<br><br>Трасса защищена отбойниками. Удерживай газ и маневрируй на поворотах!</p>
          <button class="start-btn" id="startBtn">СТАРТ ГОНКИ</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="bottom">
    🏆 ЛУЧШИЙ КРУГ: <span id="bestLap">--.--</span> | ЛУЧШАЯ ГОНКА: <span id="bestRace">--.--</span>
  </footer>
</div>

<script>
"use strict";
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

const $ = id => document.getElementById(id);
const trackCanvas = $("trackCanvas"), carCanvas = $("carCanvas");
const tctx = trackCanvas.getContext("2d"), cctx = carCanvas.getContext("2d");

let width = 800, height = 500;
function resize() {
  const rect = carCanvas.getBoundingClientRect();
  width = rect.width || 800; height = rect.height || 500;
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  [trackCanvas, carCanvas].forEach(c => {
    c.width = Math.floor(width * ratio); c.height = Math.floor(height * ratio);
    c.style.width = width + "px"; c.style.height = height + "px";
  });
  tctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  cctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  drawStaticTrack();
}
window.addEventListener("resize", resize);

// F1 Circuit parameters (Center coords, inner & outer radii for precise collision)
const trackCenter = { x: 400, y: 250 };
const trackOuterRadiusX = 350, trackOuterRadiusY = 200;
const trackInnerRadiusX = 210, trackInnerRadiusY = 100;

let running = false, paused = false;
let car = { x: 400, y: 410, angle: -Math.PI/2, speed: 0, maxSpeed: 8.5, accel: 0.14, friction: 0.05, steer: 0.055 };
let keys = { left: false, right: false, gas: false, brake: false };

let currentLap = 1, lapStartTime = 0, raceStartTime = 0, currentLapTime = 0;
let lastLapTimes = [], bestLapTime = Number(localStorage.getItem("f1BestLap") || 0);
let bestRaceTime = Number(localStorage.getItem("f1BestRace") || 0);

$("bestLap").textContent = bestLapTime ? bestLapTime.toFixed(2) + "s" : "--.--";
$("bestRace").textContent = bestRaceTime ? bestRaceTime.toFixed(2) + "s" : "--.--";

function drawStaticTrack() {
  tctx.fillStyle = "#111811"; tctx.fillRect(0, 0, width, height);

  tctx.save();
  tctx.translate(width/2, height/2);

  // Outer Kerb (Red/White stripes simulation)
  tctx.strokeStyle = "#e52225"; tctx.lineWidth = 145; tctx.lineCap = "round";
  tctx.beginPath(); tctx.ellipse(0, 0, trackOuterRadiusX + 10, trackOuterRadiusY + 10, 0, 0, Math.PI*2); tctx.stroke();

  // Outer Wall / Barrier
  tctx.strokeStyle = "#1b2438"; tctx.lineWidth = 130;
  tctx.beginPath(); tctx.ellipse(0, 0, trackOuterRadiusX, trackOuterRadiusY, 0, 0, Math.PI*2); tctx.stroke();

  // Asphalt Track
  tctx.strokeStyle = "#2b303b"; tctx.lineWidth = 110;
  tctx.beginPath(); tctx.ellipse(0, 0, trackOuterRadiusX, trackOuterRadiusY, 0, 0, Math.PI*2); tctx.stroke();

  // Center Dash Line
  tctx.strokeStyle = "#ffcc00"; tctx.lineWidth = 3; tctx.setLineDash([12, 12]);
  tctx.beginPath(); tctx.ellipse(0, 0, (trackOuterRadiusX + trackInnerRadiusX)/2, (trackOuterRadiusY + trackInnerRadiusY)/2, 0, 0, Math.PI*2); tctx.stroke();
  tctx.setLineDash([]);

  // Inner Grass Island
  tctx.fillStyle = "#111811";
  tctx.beginPath(); tctx.ellipse(0, 0, trackInnerRadiusX, trackInnerRadiusY, 0, 0, Math.PI*2); tctx.fill();
  tctx.strokeStyle = "#e52225"; tctx.lineWidth = 8; tctx.stroke();

  // Start / Finish Line
  tctx.strokeStyle = "#fff"; tctx.lineWidth = 6; tctx.setLineDash([4,4]);
  tctx.beginPath();
  let fx = 0, fy1 = -trackOuterRadiusY - 5, fy2 = -trackInnerRadiusY + 5;
  tctx.moveTo(fx, fy1); tctx.lineTo(fx, fy2); tctx.stroke();

  tctx.restore();
}

// Check boundaries (Keep car strictly between inner and outer barriers)
function checkBoundaries() {
  let dx = car.x - width/2;
  let dy = car.y - height/2;
  // Ellipse distance equation: (dx/rx)^2 + (dy/ry)^2
  let outerVal = (dx*dx) / (trackOuterRadiusX*trackOuterRadiusX) + (dy*dy) / (trackOuterRadiusY*trackOuterRadiusY);
  let innerVal = (dx*dx) / (trackInnerRadiusX*trackInnerRadiusX) + (dy*dy) / (trackInnerRadiusY*trackInnerRadiusY);

  let bounced = false;
  // Hit outer wall
  if (outerVal > 0.92) {
    car.speed *= -0.4; // Soft bounce
    // Push back inside
    car.x -= Math.cos(car.angle) * 4;
    car.y -= Math.sin(car.angle) * 4;
    bounced = true;
  }
  // Hit inner wall
  if (innerVal < 1.08) {
    car.speed *= -0.4;
    car.x += Math.cos(car.angle) * 4;
    car.y += Math.sin(car.angle) * 4;
    bounced = true;
  }
  return bounced;
}

function startRace() {
  car.x = width/2; car.y = height/2 + 160; car.angle = -Math.PI/2; car.speed = 0;
  currentLap = 1; lastLapTimes = [];
  raceStartTime = performance.now();
  lapStartTime = raceStartTime;
  running = true; paused = false;
  $("overlay").classList.add("hidden");
}

$("startBtn").addEventListener("click", startRace);

const bindBtn = (id, key) => {
  const el = $(id);
  el.addEventListener("pointerdown", e => { e.preventDefault(); keys[key] = true; });
  el.addEventListener("pointerup", e => { e.preventDefault(); keys[key] = false; });
  el.addEventListener("pointerleave", e => { keys[key] = false; });
};
bindBtn("btnLeft", "left"); bindBtn("btnRight", "right");
bindBtn("btnGas", "gas"); bindBtn("btnBrake", "brake");

function update(dt) {
  if (!running || paused) return;

  if (keys.left) car.angle -= car.steer * (car.speed / car.maxSpeed);
  if (keys.right) car.angle += car.steer * (car.speed / car.maxSpeed);

  if (keys.gas) car.speed = Math.min(car.maxSpeed, car.speed + car.accel);
  else if (keys.brake) car.speed = Math.max(-3, car.speed - car.accel * 2);
  else car.speed = Math.max(0, car.speed - car.friction);

  car.x += Math.cos(car.angle) * car.speed;
  car.y += Math.sin(car.angle) * car.speed;

  // Collision with barriers
  checkBoundaries();

  // Lap detection (Top straight finish line)
  let fx = width/2;
  let fyMin = height/2 - trackOuterRadiusY - 15;
  let fyMax = height/2 - trackInnerRadiusY + 15;

  if (Math.abs(car.x - fx) < 25 && car.y >= fyMin && car.y <= fyMax && car.speed > 1) {
    let now = performance.now();
    if (now - lapStartTime > 3000) {
      let lapTime = (now - lapStartTime) / 1000;
      lastLapTimes.push(lapTime);
      
      if (!bestLapTime || lapTime < bestLapTime) {
        bestLapTime = lapTime;
        localStorage.setItem("f1BestLap", bestLapTime);
        $("bestLap").textContent = bestLapTime.toFixed(2) + "s";
      }

      lapStartTime = now;
      currentLap++;

      if (currentLap > 3) {
        running = false;
        let totalRaceTime = lastLapTimes.reduce((a,b)=>a+b, 0);
        if (!bestRaceTime || totalRaceTime < bestRaceTime) {
          bestRaceTime = totalRaceTime;
          localStorage.setItem("f1BestRace", bestRaceTime);
          $("bestRace").textContent = bestRaceTime.toFixed(2) + "s";
        }

        $("overlay").classList.remove("hidden");
        $("title").textContent = "ФИНИШ F1!";
        $("message").innerHTML = `Гонка завершена!<br>Итоговое время: <b>${totalRaceTime.toFixed(2)}с</b><br>Лучший круг: ${bestLapTime.toFixed(2)}с`;
        $("startBtn").textContent = "ПОВТОРИТЬ ГОНКУ";
      }
    }
  }

  currentLapTime = (performance.now() - lapStartTime) / 1000;
  $("hudSpeed").textContent = Math.round(car.speed * 30);
  $("hudLap").textContent = Math.min(3, currentLap) + "/3";
  $("hudTime").textContent = currentLapTime.toFixed(2);
  $("hudBest").textContent = bestLapTime ? bestLapTime.toFixed(2) : "--.--";
}

function draw() {
  cctx.clearRect(0, 0, width, height);

  // Draw F1 Car Style
  cctx.save();
  cctx.translate(car.x, car.y);
  cctx.rotate(car.angle);

  // Rear Wing
  cctx.fillStyle = "#e52225";
  cctx.fillRect(-18, -12, 6, 24);

  // Main Body (Monoposto)
  cctx.fillStyle = "#e52225"; // Ferrari Red style
  cctx.beginPath();
  cctx.moveTo(18, 0);
  cctx.lineTo(-12, -8);
  cctx.lineTo(-14, -4);
  cctx.lineTo(-14, 4);
  cctx.lineTo(-12, 8);
  cctx.closePath();
  cctx.fill();

  // Cockpit & Driver Helmet
  cctx.fillStyle = "#111";
  cctx.fillRect(-2, -3, 6, 6);
  cctx.fillStyle = "#ffcc00"; // Helmet
  cctx.beginPath(); cctx.arc(1, 0, 3, 0, Math.PI*2); cctx.fill();

  // Wheels
  cctx.fillStyle = "#111";
  cctx.fillRect(-12, -15, 8, 5); // Rear Left
  cctx.fillRect(-12, 10, 8, 5);  // Rear Right
  cctx.fillRect(8, -14, 7, 4);   // Front Left
  cctx.fillRect(8, 10, 7, 4);    // Front Right

  // Front Wing
  cctx.fillStyle = "#fff";
  cctx.fillRect(14, -14, 4, 28);

  cctx.restore();
}

let lastTime = 0;
function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = Math.min((timestamp - lastTime) / 1000, 0.033);
  lastTime = timestamp;

  update(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
