<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Arkanoid — FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg-grad: radial-gradient(circle at 50% 20%, rgba(41, 16, 95, 0.9) 0%, rgba(7, 9, 34, 0.95) 50%, rgba(1, 2, 8, 1) 100%);
  --portal-bg: rgba(4, 7, 20, 0.92);
  --border-col: rgba(32, 232, 255, 0.4);
  --accent-col: #20e8ff;
  --title-col: #ffd52c;
  --btn-bg: rgba(16, 26, 60, 0.95);
  --btn-hover: #213c8f;
  --glass-bg: rgba(32, 232, 255, 0.08);
  --neon-glow: rgba(32, 232, 255, 0.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{
  padding:4px;display:flex;justify-content:center;align-items:center;
  background: var(--bg-grad); position: fixed; inset: 0;
}
.portal{
  width: 100%; height: 100%; max-width: 420px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; gap: 6px;
  overflow-y: auto; padding: 8px; z-index: 10;
  background: var(--portal-bg); border: 2px solid var(--border-col);
  border-radius: 12px; box-shadow: 0 0 25px rgba(0,0,0,0.8);
  position: relative;
}
.game-ui-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 8px; width: 100%; flex-shrink: 0; font-size: 11px; }

#gameContainer { flex-grow: 1; width: 100%; position: relative; background: #010206; border: 2px solid var(--accent-col); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
canvas { width: 100%; height: 100%; object-fit: contain; background: #010206; }

/* УПРАВЛЕНИЕ АРКАНОИДОМ */
.game-controls { display: flex; gap: 10px; justify-content: center; width: 100%; padding: 4px; flex-shrink: 0; }
.ctrl-pad-btn { 
  background: var(--glass-bg); backdrop-filter: blur(4px);
  border: 2px solid var(--accent-col); color: var(--title-col); 
  font-size: 16px; font-weight: bold; width: 140px; height: 50px; border-radius: 10px; 
  display: flex; justify-content: center; align-items: center; 
  cursor: pointer; user-select: none; box-shadow: 0 0 10px var(--neon-glow); 
  transition: transform 0.1s;
}
.ctrl-pad-btn:active { background: var(--btn-hover); transform: scale(0.92); border-color: var(--title-col); }
</style>
</head>
<body>

<!-- УНИВЕРСАЛЬНАЯ ПЛАВАЮЩАЯ КНОПКА ВОЗВРАТА В МЕНЮ -->
<div style="position: fixed; top: 10px; left: 10px; z-index: 99999;">
  <a href="index.html" style="display: flex; align-items: center; gap: 4px; background: rgba(140, 5, 5, 0.95); border: 2px solid #ff6b55; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-family: monospace; font-size: 11px; font-weight: bold; box-shadow: 0 0 15px rgba(255,0,0,0.7); -webkit-tap-highlight-color: transparent;">
    ⬅ МЕНЮ
  </a>
</div>

<div class="portal">
  <div class="game-ui-header">
    <div id="scoreTxt" style="color:var(--title-col);">СЧЕТ: 0</div>
    <div id="livesTxt" style="color:var(--accent-col);">ЖИЗНИ: ❤️❤️❤️</div>
  </div>

  <div id="gameContainer">
    <canvas id="aCanvas" width="360" height="480"></canvas>
  </div>

  <div class="game-controls">
    <button class="ctrl-pad-btn" id="btnLeft">◀ НАЛЕВО</button>
    <button class="ctrl-pad-btn" id="btnRight">НАПРАВО ▶</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
let soundEnabled = localStorage.getItem("freezzzSound") !== "false";
function haptic() {
  if (soundEnabled && tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
  }
}

const canvas = document.getElementById('aCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let lives = 3;

// Платформа
let paddle = {
  x: 130,
  y: 440,
  w: 90,
  h: 12,
  dx: 0
};

// Шары
let balls = [{
  x: 180,
  y: 400,
  r: 6,
  vx: 3,
  vy: -3
}];

// Блоки
const brickRowCount = 6;
const brickColumnCount = 10;
const brickWidth = 33;
const brickHeight = 14;
const brickPadding = 3;
const brickOffsetTop = 40;
const brickOffsetLeft = 12;

let bricks = [];
let powerUps = []; 

function initLevel() {
  bricks = [];
  for (let c = 0; c < brickColumnCount; c++) {
    bricks[c] = [];
    for (let r = 0; r < brickRowCount; r++) {
      let patternType = (r + c) % 5 + 1;
      bricks[c][r] = {
        x: (c * (brickWidth + brickPadding)) + brickOffsetLeft,
        y: (r * (brickHeight + brickPadding)) + brickOffsetTop,
        status: 1,
        pattern: patternType,
        hasPowerUp: Math.random() < 0.25 
      };
    }
  }
}

initLevel();

// Отрисовка 5 разных узоров на блоках
function drawBrickPattern(bx, by, bw, bh, pattern) {
  ctx.fillStyle = '#010206';
  ctx.fillRect(bx, by, bw, bh);

  if (pattern === 1) {
    ctx.fillStyle = '#20e8ff';
    ctx.fillRect(bx+1, by+1, bw-2, bh-2);
    ctx.fillStyle = '#010206';
    ctx.fillRect(bx+4, by+4, bw-8, bh-8);
  } else if (pattern === 2) {
    ctx.fillStyle = '#ff3366';
    ctx.fillRect(bx+1, by+1, bw-2, bh-2);
    ctx.fillStyle = '#ffd52c';
    ctx.fillRect(bx+4, by+2, 4, bh-4);
    ctx.fillRect(bx+14, by+2, 4, bh-4);
    ctx.fillRect(bx+24, by+2, 4, bh-4);
  } else if (pattern === 3) {
    ctx.fillStyle = '#00ff88';
    ctx.fillRect(bx+1, by+1, bw-2, bh-2);
    ctx.fillStyle = '#010206';
    ctx.fillRect(bx+2, by+4, bw-4, bh-8);
  } else if (pattern === 4) {
    ctx.fillStyle = '#b033ff';
    ctx.fillRect(bx+1, by+1, bw-2, bh-2);
    ctx.fillStyle = '#ffd52c';
    ctx.fillRect(bx + bw/2 - 3, by + 2, 6, bh - 4);
  } else {
    ctx.fillStyle = '#ffd52c';
    ctx.fillRect(bx+1, by+1, bw-2, bh-2);
    ctx.fillStyle = '#ff3366';
    ctx.fillRect(bx+3, by+3, bw-6, bh-6);
  }
}

let isLeft = false;
let isRight = false;

document.getElementById('btnLeft').addEventListener('pointerdown', () => isLeft = true);
document.getElementById('btnLeft').addEventListener('pointerup', () => isLeft = false);
document.getElementById('btnLeft').addEventListener('pointerleave', () => isLeft = false);

document.getElementById('btnRight').addEventListener('pointerdown', () => isRight = true);
document.getElementById('btnRight').addEventListener('pointerup', () => isRight = false);
document.getElementById('btnRight').addEventListener('pointerleave', () => isRight = false);

function update() {
  if (isLeft) paddle.x -= 6;
  if (isRight) paddle.x += 6;

  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;

  // Движение падающих бонусов
  powerUps.forEach(p => {
    p.y += 2;
    if (p.y + 10 >= paddle.y && p.x >= paddle.x && p.x <= paddle.x + paddle.w) {
      haptic();
      if (p.type === 'wide') {
        paddle.w = Math.min(140, paddle.w + 30);
      } else if (p.type === 'multi') {
        let newBall = {x: balls[0].x, y: balls[0].y, r: 6, vx: -3, vy: -3};
        let newBall2 = {x: balls[0].x, y: balls[0].y, r: 6, vx: 2, vy: -4};
        balls.push(newBall, newBall2);
      } else {
        score += 200;
      }
      p.dead = true;
    }
  });
  powerUps = powerUps.filter(p => !p.dead && p.y < canvas.height);

  // Движение шаров
  balls.forEach(ball => {
    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.x - ball.r < 0 || ball.x + ball.r > canvas.width) {
      ball.vx *= -1;
      haptic();
    }
    if (ball.y - ball.r < 0) {
      ball.vy *= -1;
      haptic();
    }

    if (ball.y + ball.r >= paddle.y && ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
      let hitPoint = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      ball.vx = hitPoint * 5;
      ball.vy = -Math.abs(ball.vy);
      haptic();
    }

    for (let c = 0; c < brickColumnCount; c++) {
      for (let r = 0; r < brickRowCount; r++) {
        let b = bricks[c][r];
        if (b.status === 1) {
          if (ball.x > b.x && ball.x < b.x + brickWidth && ball.y > b.y && ball.y < b.y + brickHeight) {
            ball.vy *= -1;
            b.status = 0;
            score += 50;
            haptic();

            if (b.hasPowerUp) {
              let pType = Math.random() < 0.5 ? 'wide' : 'multi';
              powerUps.push({x: b.x + brickWidth/2, y: b.y, type: pType});
            }

            let won = true;
            outer: for (let cc = 0; cc < brickColumnCount; cc++) {
              for (let rr = 0; rr < brickRowCount; rr++) {
                if (bricks[cc][rr].status === 1) { won = false; break outer; }
              }
            }
            if (won) {
              alert("Уровень пройден! Счёт: " + score);
              initLevel();
            }
          }
        }
      }
    }
  });

  // Проверка падения шаров ниже экрана
  balls = balls.filter(ball => ball.y - ball.r < canvas.height);
  if (balls.length === 0) {
    lives--;
    haptic();
    if (lives <= 0) {
      alert("Игра окончена! Счёт: " + score);
      score = 0;
      lives = 3;
      paddle.w = 90;
      initLevel();
    }
    balls.push({x: 180, y: 350, r: 6, vx: 3, vy: -3});
  }

  document.getElementById('scoreTxt').textContent = "СЧЕТ: " + score;
  let hearts = "";
  for(let i=0; i<lives; i++) hearts += "❤️";
  document.getElementById('livesTxt').textContent = "ЖИЗНИ: " + hearts;
}

function draw() {
  ctx.fillStyle = '#010206';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let c = 0; c < brickColumnCount; c++) {
    for (let r = 0; r < brickRowCount; r++) {
      if (bricks[c][r].status === 1) {
        let b = bricks[c][r];
        drawBrickPattern(b.x, b.y, brickWidth, brickHeight, b.pattern);
      }
    }
  }

  powerUps.forEach(p => {
    ctx.fillStyle = p.type === 'wide' ? '#00ff88' : '#ffd52c';
    ctx.shadowBlur = 8;
    ctx.shadowColor = ctx.fillStyle;
    ctx.fillRect(p.x - 6, p.y - 6, 12, 12);
  });
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#20e8ff';
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#20e8ff';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

  balls.forEach(ball => {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd52c';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ffd52c';
    ctx.fill();
    ctx.closePath();
  });
  ctx.shadowBlur = 0;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
