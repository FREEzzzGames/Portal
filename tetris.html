<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tetris — FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg-grad: radial-gradient(circle at 50% 20%, rgba(41, 16, 95, 0.9) 0%, rgba(7, 9, 34, 0.95) 50%, rgba(1, 2, 8, 1) 100%);
  --portal-bg: rgba(4, 7, 20, 0.92);
  --border-col: rgba(32, 232, 255, 0.4);
  --accent-col: #20e8ff;
  --title-col: #ffd52c;
  --btn-bg: rgba(16, 26, 60, 0.95);
  --btn-hover: #213c8f;
  --glass-bg: rgba(32, 232, 255, 0.08);
  --neon-glow: rgba(32, 232, 255, 0.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{
  padding:4px;display:flex;justify-content:center;align-items:center;
  background: var(--bg-grad); position: fixed; inset: 0;
}
.portal{
  width: 100%; height: 100%; max-width: 420px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; gap: 6px;
  overflow-y: auto; padding: 8px; z-index: 10;
  background: var(--portal-bg); border: 2px solid var(--border-col);
  border-radius: 12px; box-shadow: 0 0 25px rgba(0,0,0,0.8);
  position: relative;
}
.game-ui-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 8px; width: 100%; flex-shrink: 0; font-size: 11px; }

#gameContainer { flex-grow: 1; width: 100%; position: relative; background: #010206; border: 2px solid var(--accent-col); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
canvas { width: 100%; height: 100%; object-fit: contain; background: #010206; }

/* УДОБНЫЕ КРУПНЫЕ КНОПКИ ДЛЯ ТЕТРИСА */
.game-controls { display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 4px; flex-shrink: 0; }
.ctrl-row { display: flex; gap: 8px; justify-content: center; }
.ctrl-pad-btn { 
  background: var(--glass-bg); backdrop-filter: blur(4px);
  border: 2px solid var(--accent-col); color: var(--title-col); 
  font-size: 18px; font-weight: bold; width: 90px; height: 50px; border-radius: 10px; 
  display: flex; justify-content: center; align-items: center; 
  cursor: pointer; user-select: none; box-shadow: 0 0 10px var(--neon-glow); 
  transition: transform 0.1s;
}
.ctrl-pad-btn:active { background: var(--btn-hover); transform: scale(0.92); border-color: var(--title-col); }
</style>
</head>
<body>

<!-- УНИВЕРСАЛЬНАЯ ПЛАВАЮЩАЯ КНОПКА ВОЗВРАТА В МЕНЮ -->
<div style="position: fixed; top: 10px; left: 10px; z-index: 99999;">
  <a href="index.html" style="display: flex; align-items: center; gap: 4px; background: rgba(140, 5, 5, 0.95); border: 2px solid #ff6b55; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-family: monospace; font-size: 11px; font-weight: bold; box-shadow: 0 0 15px rgba(255,0,0,0.7); -webkit-tap-highlight-color: transparent;">
    ⬅ МЕНЮ
  </a>
</div>

<div class="portal">
  <div class="game-ui-header">
    <div id="scoreTxt" style="color:var(--title-col);">СЧЕТ: 0</div>
    <div id="linesTxt" style="color:var(--accent-col);">ЛИНИИ: 0</div>
  </div>

  <div id="gameContainer">
    <canvas id="tCanvas" width="240" height="400"></canvas>
  </div>

  <div class="game-controls">
    <div class="ctrl-row">
      <button class="ctrl-pad-btn" id="btnLeft">◀ ВЛЕВО</button>
      <button class="ctrl-pad-btn" id="btnRot">🔄 ПОВОРОТ</button>
      <button class="ctrl-pad-btn" id="btnRight">ВПРАВО ▶</button>
    </div>
    <div class="ctrl-row">
      <button class="ctrl-pad-btn" id="btnDrop" style="width: 288px; background: rgba(32, 232, 255, 0.15);">⚡ БЫСТРЫЙ СБРОС ▼</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
let soundEnabled = localStorage.getItem("freezzzSound") !== "false";
function haptic() {
  if (soundEnabled && tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
  }
}

const canvas = document.getElementById('tCanvas');
const ctx = canvas.getContext('2d');
const BLOCK_SIZE = 20;
const COLS = 12;
const ROWS = 20;

let board = Array.from({length: ROWS}, () => Array(COLS).fill(0));

const SHAPES = [
  [[1,1,1,1]], // I
  [[1,1],[1,1]], // O
  [[0,1,0],[1,1,1]], // T
  [[0,1,1],[1,1,0]], // S
  [[1,1,0],[0,1,1]], // Z
  [[1,0,0],[1,1,1]], // J
  [[0,0,1],[1,1,1]]  // L
];

const COLORS = ['', '#20e8ff', '#ffd52c', '#b033ff', '#00ff88', '#ff3366', '#3366ff', '#ff8800'];

let currentPiece = {
  shape: SHAPES[0],
  color: 1,
  x: 4,
  y: 0
};

let score = 0;
let lines = 0;
let dropCounter = 0;
let dropInterval = 600; 
let lastTime = 0;

function spawnPiece() {
  const rand = Math.floor(Math.random() * SHAPES.length);
  currentPiece.shape = SHAPES[rand];
  currentPiece.color = rand + 1;
  currentPiece.x = Math.floor(COLS / 2) - Math.floor(currentPiece.shape[0].length / 2);
  currentPiece.y = 0;

  if (checkCollision(0, 0, currentPiece.shape)) {
    let best = Number(localStorage.getItem("tetrisHighScore") || 0);
    if (score > best) localStorage.setItem("tetrisHighScore", score);
    alert("Игра окончена! Счёт: " + score);
    board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    score = 0;
    lines = 0;
    updateUI();
    spawnPiece();
  }
}

function checkCollision(offsetX, offsetY, shape) {
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (shape[r][c]) {
        let newX = currentPiece.x + c + offsetX;
        let newY = currentPiece.y + r + offsetY;
        if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
        if (newY >= 0 && board[newY][newX]) return true;
      }
    }
  }
  return false;
}

function mergePiece() {
  currentPiece.shape.forEach((row, r) => {
    row.forEach((value, c) => {
      if (value) {
        if (currentPiece.y + r >= 0) {
          board[currentPiece.y + r][currentPiece.x + c] = currentPiece.color;
        }
      }
    });
  });
}

function clearLines() {
  let cleared = 0;
  outer: for (let r = ROWS - 1; r >= 0; r--) {
    for (let c = 0; c < COLS; c++) {
      if (!board[r][c]) continue outer;
    }
    board.splice(r, 1);
    board.unshift(Array(COLS).fill(0));
    cleared++;
    r++;
  }
  if (cleared > 0) {
    lines += cleared;
    score += cleared * 100 * cleared;
    updateUI();
    haptic();
  }
}

function rotatePiece() {
  let rotated = currentPiece.shape[0].map((_, index) =>
    currentPiece.shape.map(row => row[index]).reverse()
  );
  let originalX = currentPiece.x;
  let shift = 1;
  while (checkCollision(0, 0, rotated)) {
    currentPiece.x += shift;
    shift = -(shift + (shift > 0 ? 1 : -1));
    if (shift > rotated[0].length) {
      currentPiece.x = originalX;
      return;
    }
  }
  currentPiece.shape = rotated;
  haptic();
}

function moveLeft() {
  if (!checkCollision(-1, 0, currentPiece.shape)) {
    currentPiece.x--;
    haptic();
  }
}

function moveRight() {
  if (!checkCollision(1, 0, currentPiece.shape)) {
    currentPiece.x++;
    haptic();
  }
}

// Моментальный сброс фигурки вниз до упора (Hard Drop)
function hardDrop() {
  let dropDistance = 0;
  while (!checkCollision(0, dropDistance + 1, currentPiece.shape)) {
    dropDistance++;
  }
  currentPiece.y += dropDistance;
  mergePiece();
  clearLines();
  spawnPiece();
  dropCounter = 0;
  haptic();
}

function moveDownStep() {
  if (!checkCollision(0, 1, currentPiece.shape)) {
    currentPiece.y++;
  } else {
    mergePiece();
    clearLines();
    spawnPiece();
  }
  dropCounter = 0;
}

function updateUI() {
  document.getElementById('scoreTxt').textContent = "СЧЕТ: " + score;
  document.getElementById('linesTxt').textContent = "ЛИНИИ: " + lines;
}

// Управление кнопками
document.getElementById('btnLeft').addEventListener('pointerdown', moveLeft);
document.getElementById('btnRight').addEventListener('pointerdown', moveRight);
document.getElementById('btnRot').addEventListener('pointerdown', rotatePiece);
document.getElementById('btnDrop').addEventListener('pointerdown', hardDrop);

spawnPiece();

function draw() {
  ctx.fillStyle = '#010206';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Отрисовка стакана
  board.forEach((row, r) => {
    row.forEach((color, c) => {
      if (color) {
        ctx.fillStyle = COLORS[color];
        ctx.shadowBlur = 6;
        ctx.shadowColor = COLORS[color];
        ctx.fillRect(c * BLOCK_SIZE + 1, r * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
      }
    });
  });

  // Отрисовка текущей фигурки
  currentPiece.shape.forEach((row, r) => {
    row.forEach((value, c) => {
      if (value) {
        ctx.fillStyle = COLORS[currentPiece.color];
        ctx.shadowBlur = 8;
        ctx.shadowColor = COLORS[currentPiece.color];
        ctx.fillRect((currentPiece.x + c) * BLOCK_SIZE + 1, (currentPiece.y + r) * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
      }
    });
  });
  ctx.shadowBlur = 0;
}

function update(time = 0) {
  const deltaTime = time - lastTime;
  lastTime = time;
  dropCounter += deltaTime;
  if (dropCounter > dropInterval) {
    moveDownStep();
  }
  draw();
  requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>
</body>
</html>
