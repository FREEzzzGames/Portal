<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CLASSIC TETRIS — TG MINI APP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{padding:4px;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 0,#180b30 0%,#060818 50%,#010206 100%);}

.arcade{width:min(500px,100%);height:100%;max-height:750px;overflow:hidden;border:3px solid #1e2548;border-radius:16px;background:#080b1e;box-shadow:0 0 40px #153cff44;display:flex;flex-direction:column;}

.marquee{padding:8px;text-align:center;background:#090d24;border-bottom:3px solid #161e3f;}
.marquee h1{margin:0;font-size:clamp(18px,3.5vw,28px);color:#ffd52c;text-shadow:2px 2px #e52225;}
.sub{color:#20eaff;font-size:clamp(8px,1.5vw,11px);font-weight:bold;}

.screen-wrapper{flex-grow:1;position:relative;background:#050712;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:10px;gap:15px;}

/* TETRIS BOARD */
canvas{background:#03050c;border:3px solid #20e8ff;border-radius:6px;box-shadow:0 0 15px #00d9ff22;}

/* SIDE PANEL (SCORE & NEXT) */
.side-panel{display:flex;flex-direction:column;gap:10px;width:110px;}
.infobox{padding:6px;border:2px solid #20e8ff;border-radius:6px;text-align:center;background:#020922dd;box-shadow:0 0 8px #00d9ff33;}
.infobox small{display:block;color:#20e8ff;font-size:8px;}
.infobox b{display:block;font-size:15px;color:#fff;}
.next-canvas{background:#020409;border:2px solid #1634a4;border-radius:4px;margin-top:2px;}

/* CONTROLS */
.controls{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px;background:#070a1e;border-top:2px solid #161e3f;}
.group-left{display:grid;grid-template-columns:repeat(3, 50px);grid-template-rows:repeat(2, 45px);gap:6px;}
.group-right{display:flex;flex-direction:column;gap:6px;}

.ctrl-btn{border:2px solid rgba(255,255,255,.3);border-radius:8px;background:rgba(255,255,255,.08);color:#fff;font-size:18px;display:flex;justify-content:center;align-items:center;user-select:none;cursor:pointer;}
.ctrl-btn:active{background:rgba(32,232,255,.3);border-color:#20e8ff;}
.ctrl-btn.wide{grid-column: span 3;height:38px;font-size:11px;background:linear-gradient(#ff6b55,#8c0505);border-color:#7b1717;font-weight:bold;}
.ctrl-btn.rotate{background:rgba(255,200,0,.15);border-color:rgba(255,200,0,.4);}
.ctrl-btn.drop{width:70px;height:75px;font-size:22px;background:rgba(0,255,100,.15);border-color:rgba(0,255,100,.4);}

/* OVERLAY */
.overlay{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:#02030be8;}
.overlay.hidden{display:none;}
.card{width:min(320px,90%);padding:18px;border:3px solid #20e8ff;border-radius:12px;background:#060a1bef;text-align:center;box-shadow:0 0 30px #00d9ff55;}
.card h2{margin:0 0 8px;color:#ffd42a;font-size:22px;text-shadow:2px 2px #f22;}
.card p{color:#b8eaff;font-size:12px;line-height:1.4;}
.start-btn{margin-top:12px;width:100%;height:42px;border:2px solid #20e8ff;border-radius:6px;background:#0f2766;color:#fff;font:bold 14px monospace;cursor:pointer;}

.bottom{padding:5px;text-align:center;border-top:2px solid #111a3b;color:#ffd42a;font-size:12px;background:#050716;}
</style>
</head>
<body>
<div class="arcade">
  <header class="marquee">
    <h1>TETRIS <span>CLASSIC</span></h1>
    <div class="sub">TELEGRAM EDITION</div>
  </header>

  <div class="screen-wrapper">
    <canvas id="tetris" width="200" height="400"></canvas>
    
    <div class="side-panel">
      <div class="infobox">
        <small>SCORE</small>
        <b id="score">000000</b>
      </div>
      <div class="infobox">
        <small>LINES</small>
        <b id="lines">0</b>
      </div>
      <div class="infobox">
        <small>NEXT</small>
        <canvas id="next" width="60" height="60" class="next-canvas"></canvas>
      </div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <!-- Левая группа: Влево, Вправо, Поворот и Старт/Пауза -->
    <div class="group-left">
      <div class="ctrl-btn" id="btnLeft">◄</div>
      <div class="ctrl-btn rotate" id="btnRotate">↻</div>
      <div class="ctrl-btn" id="btnRight">►</div>
      <button class="ctrl-btn wide" id="startBtn">СТАРТ / ПАУЗА</button>
    </div>

    <!-- Правая группа: Сброс / Вниз -->
    <div class="group-right">
      <div class="ctrl-btn drop" id="btnDrop">▼</div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="title">TETRIS</h2>
      <p id="message">Складывай линии и ставь рекорды!<br><br>Слева — движение и поворот, справа — ускорение вниз.</p>
      <button class="start-btn" id="overlayStart">НАЧАТЬ ИГРУ</button>
    </div>
  </div>

  <footer class="bottom">
    🏆 HIGH SCORE: <span id="highScore">000000</span>
  </footer>
</div>

<script>
"use strict";
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
const nextCanvas = document.getElementById('next');
const nCtx = nextCanvas.getContext('2d');

context.scale(20, 20);
nCtx.scale(15, 15);

const colors = [
  null,
  '#FF0D72', // I
  '#0DC2FF', // J
  '#0DFF72', // L
  '#F538FF', // O
  '#FF8E0D', // S
  '#FFE138', // T
  '#3877FF'  // Z
];

const arena = createMatrix(10, 20);

const player = {
  pos: {x: 0, y: 0},
  matrix: null,
  score: 0,
  lines: 0,
  nextMatrix: null
};

let highScore = Number(localStorage.getItem("tetrisHighScore") || 0);
document.getElementById('highScore').textContent = String(highScore).padStart(6, '0');

let dropCounter = 0;
let dropInterval = 1000;
let lastTime = 0;
let running = false;
let paused = false;

function createMatrix(w, h) {
  const matrix = [];
  while (h--) {
    matrix.push(new Array(w).fill(0));
  }
  return matrix;
}

function createPiece(type) {
  if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
  else if (type === 'J') return [[0,2,0],[0,2,0],[2,2,0]];
  else if (type === 'L') return [[0,3,0],[0,3,0],[0,3,3]];
  else if (type === 'O') return [[4,4],[4,4]];
  else if (type === 'S') return [[0,5,5],[5,5,0],[0,0,0]];
  else if (type === 'T') return [[0,6,0],[6,6,6],[0,0,0]];
  else if (type === 'Z') return [[7,7,0],[0,7,7],[0,0,0]];
}

function drawMatrix(matrix, offset, ctx = context) {
  matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        ctx.fillStyle = colors[value];
        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 0.05;
        ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
      }
    });
  });
}

function draw() {
  context.fillStyle = '#03050c';
  context.fillRect(0, 0, canvas.width, canvas.height);
  drawMatrix(arena, {x: 0, y: 0});
  if (player.matrix) drawMatrix(player.matrix, player.pos);

  // Next piece preview
  nCtx.fillStyle = '#020409';
  nCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (player.nextMatrix) {
    let offset = {
      x: (4 - player.nextMatrix[0].length) / 2,
      y: (4 - player.nextMatrix.length) / 2
    };
    drawMatrix(player.nextMatrix, offset, nCtx);
  }
}

function merge(arena, player) {
  player.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        arena[y + player.pos.y][x + player.pos.x] = value;
      }
    });
  });
}

function rotate(matrix, dir) {
  for (let y = 0; y < matrix.length; ++y) {
    for (let x = 0; x < y; ++x) {
      [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
    }
  }
  if (dir > 0) matrix.forEach(row => row.reverse());
  else matrix.reverse();
}

function playerRotate() {
  const posX = player.pos.x;
  let offset = 1;
  rotate(player.matrix, 1);
  while (collide(arena, player)) {
    player.pos.x += offset;
    offset = -(offset + (offset > 0 ? 1 : -1));
    if (offset > player.matrix[0].length) {
      rotate(player.matrix, -1);
      player.pos.x = posX;
      return;
    }
  }
}

function collide(arena, player) {
  const m = player.matrix;
  const o = player.pos;
  for (let y = 0; y < m.length; ++y) {
    for (let x = 0; x < m[y].length; ++x) {
      if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
        return true;
      }
    }
  }
  return false;
}

function arenaSweep() {
  let rowCount = 1;
  outer: for (let y = arena.length - 1; y > 0; --y) {
    for (let x = 0; x < arena[y].length; ++x) {
      if (arena[y][x] === 0) continue outer;
    }
    const row = arena.splice(y, 1)[0].fill(0);
    arena.unshift(row);
    ++y;
    player.score += rowCount * 100;
    player.lines++;
    rowCount *= 2;
  }
  updateScore();
}

function playerDrop() {
  player.pos.y++;
  if (collide(arena, player)) {
    player.pos.y--;
    merge(arena, player);
    playerReset();
    arenaSweep();
  }
  dropCounter = 0;
}

function playerMove(dir) {
  player.pos.x += dir;
  if (collide(arena, player)) {
    player.pos.x -= dir;
  }
}

function playerReset() {
  const pieces = 'IJLOSZT';
  if (!player.nextMatrix) {
    player.nextMatrix = createPiece(pieces[(pieces.length * Math.random()) | 0]);
  }
  player.matrix = player.nextMatrix;
  player.nextMatrix = createPiece(pieces[(pieces.length * Math.random()) | 0]);
  
  player.pos.y = 0;
  player.pos.x = ((arena[0].length / 2) | 0) - ((player.matrix[0].length / 2) | 0);

  if (collide(arena, player)) {
    running = false;
    if (player.score > highScore) {
      highScore = player.score;
      localStorage.setItem("tetrisHighScore", highScore);
      document.getElementById('highScore').textContent = String(highScore).padStart(6, '0');
    }
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('title').textContent = "ИГРА ОКОНЧЕНА";
    document.getElementById('message').innerHTML = `Счёт: <b>${player.score}</b><br>Линии: ${player.lines}`;
    document.getElementById('overlayStart').textContent = "ИГРАТЬ СНОВА";
  }
}

function updateScore() {
  document.getElementById('score').textContent = String(player.score).padStart(6, '0');
  document.getElementById('lines').textContent = player.lines;
}

function startGame() {
  arena.forEach(row => row.fill(0));
  player.score = 0;
  player.lines = 0;
  player.nextMatrix = null;
  updateScore();
  playerReset();
  running = true;
  paused = false;
  document.getElementById('overlay').classList.add('hidden');
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  const overlay = document.getElementById('overlay');
  overlay.classList.toggle('hidden', !paused);
  if (paused) {
    document.getElementById('title').textContent = "ПАУЗА";
    document.getElementById('message').innerHTML = "Игра приостановлена.";
    document.getElementById('overlayStart').textContent = "ПРОДОЛЖИТЬ";
  }
}

// Кнопки управления
const bind = (id, action) => {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); if(running && !paused) action(); });
};

bind('btnLeft', () => playerMove(-1));
bind('btnRight', () => playerMove(1));
bind('btnRotate', playerRotate);
bind('btnDrop', playerDrop);

document.getElementById('startBtn').addEventListener('click', togglePause);
document.getElementById('overlayStart').addEventListener('click', () => {
  if (paused) {
    paused = false;
    document.getElementById('overlay').classList.add('hidden');
  } else {
    startGame();
  }
});

function update(time = 0) {
  const deltaTime = time - lastTime;
  lastTime = time;

  if (running && !paused) {
    dropCounter += deltaTime;
    if (dropCounter > dropInterval) {
      playerDrop();
    }
  }

  draw();
  requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
