<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SPACE INVADERS — FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{padding:6px;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 0,#29105f 0%,#070922 35%,#010208 85%);}
.arcade{width:min(500px,100%);height:100%;max-height:750px;border:3px solid #151a32;border-radius:16px;background:#070a15;display:flex;flex-direction:column;}
.marquee{padding:8px;text-align:center;background:#070925;border-bottom:3px solid #121936;}
.marquee h1{margin:0;font-size:18px;color:#ffd52c;text-shadow:2px 2px #e52225;}
.screen-wrapper{flex-grow:1;position:relative;background:#03050c;display:flex;justify-content:center;align-items:center;padding:10px;}
canvas{background:#010206;border:2px solid #20e8ff;border-radius:6px;width:100%;height:100%;object-fit:contain;}
.controls{display:flex;justify-content:space-between;padding:10px;background:#070a18;border-top:3px solid #141c38;gap:8px;}
.ctrl-btn{width:30%;height:55px;border:2px solid rgba(255,255,255,.3);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:20px;display:flex;justify-content:center;align-items:center;user-select:none;cursor:pointer;}
.ctrl-btn:active{background:rgba(32,232,255,.35);border-color:#20e8ff;}
.ctrl-btn.fire{background:rgba(255,50,50,.2);border-color:rgba(255,50,50,.5);color:#ff5b43;}
.overlay{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:#02030be8;}
.overlay.hidden{display:none;}
.card{width:min(320px,90%);padding:18px;border:3px solid #20e8ff;border-radius:12px;background:#060a1bef;text-align:center;}
.card h2{margin:0 0 8px;color:#ffd42a;font-size:20px;}
.card p{color:#b8eaff;font-size:12px;}
.start-btn{margin-top:12px;width:100%;height:40px;border:2px solid #20e8ff;border-radius:6px;background:#0f2766;color:#fff;font:bold 13px monospace;cursor:pointer;}
.bottom{padding:4px;text-align:center;border-top:2px solid #111a3b;color:#ffd42a;font-size:10px;background:#050716;}
</style>
</head>
<body>
<div class="arcade">
  <div class="marquee"><h1>SPACE INVADERS 👾</h1></div>
  <div class="screen-wrapper"><canvas id="invaders" width="400" height="500"></canvas></div>
  <div class="controls">
    <div class="ctrl-btn" id="btnLeft">◄</div>
    <div class="ctrl-btn fire" id="btnFire">🔥</div>
    <div class="ctrl-btn" id="btnRight">►</div>
  </div>
  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="title">INVADERS</h2>
      <p>Уничтожь инопланетян!<br><br>Слева/справа движение, красная кнопка — огонь.</p>
      <button class="start-btn" id="startBtn">СТАРТ</button>
    </div>
  </div>
  <footer class="bottom">ЗАЩИТИ КОСМОС</footer>
</div>
<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const canvas = document.getElementById('invaders'), ctx = canvas.getContext('2d');
let running = false, dir = 0;
let ship = {x: 180, y: 450, w: 30, h: 16, speed: 4};
let bullets = [], enemies = [], enemyDir = 1;

function initEnemies() {
  enemies = [];
  for(let r=0; r<3; r++) {
    for(let c=0; c<6; c++) {
      enemies.push({x: c * 50 + 40, y: r * 30 + 30, w: 26, h: 18, alive: true});
    }
  }
}

function update() {
  if (!running) return;
  ship.x += dir * ship.speed;
  if (ship.x < 0) ship.x = 0;
  if (ship.x > canvas.width - ship.w) ship.x = canvas.width - ship.w;

  bullets.forEach(b => b.y -= 7);
  bullets = bullets.filter(b => b.y > 0);

  let shiftDown = false;
  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += enemyDir * 0.8;
    if (e.x <= 10 || e.x >= canvas.width - 36) shiftDown = true;
  });
  if (shiftDown) {
    enemyDir *= -1;
    enemies.forEach(e => e.y += 15);
  }

  // Коллизии пуль с врагами
  bullets.forEach((b, bi) => {
    enemies.forEach(e => {
      if (e.alive && b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
        e.alive = false;
        bullets.splice(bi, 1);
      }
    });
  });

  if (enemies.every(e => !e.alive)) {
    running = false; showOver("ПОБЕДА!");
  }
}

function showOver(text) {
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('title').textContent = text;
  document.getElementById('startBtn').textContent = "ЕЩЕ РАЗ";
}

function draw() {
  ctx.fillStyle = '#010206'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#20e8ff'; ctx.fillRect(ship.x, ship.y, ship.w, ship.h);
  ctx.fillStyle = '#ff5b43'; bullets.forEach(b => ctx.fillRect(b.x, b.y, 4, 10));
  ctx.fillStyle = '#ffd52c';
  enemies.forEach(e => { if (e.alive) ctx.fillRect(e.x, e.y, e.w, e.h); });
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

document.getElementById('btnLeft').addEventListener('pointerdown', () => dir = -1);
document.getElementById('btnLeft').addEventListener('pointerup', () => dir = 0);
document.getElementById('btnRight').addEventListener('pointerdown', () => dir = 1);
document.getElementById('btnRight').addEventListener('pointerup', () => dir = 0);
document.getElementById('btnFire').addEventListener('click', () => {
  if (running) bullets.push({x: ship.x + ship.w/2 - 2, y: ship.y});
});
document.getElementById('startBtn').addEventListener('click', () => {
  ship.x = 180; bullets = []; enemyDir = 1; initEnemies(); running = true;
  document.getElementById('overlay').classList.add('hidden');
});
loop();
</script>
</body>
</html>
