<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RETRO JUMPER — FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{padding:6px;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 0,#29105f 0%,#070922 35%,#010208 85%);}
.arcade{width:min(500px,100%);height:100%;max-height:750px;border:3px solid #151a32;border-radius:16px;background:#070a15;display:flex;flex-direction:column;}
.marquee{padding:8px;text-align:center;background:#070925;border-bottom:3px solid #121936;}
.marquee h1{margin:0;font-size:18px;color:#ffd52c;text-shadow:2px 2px #e52225;}
.screen-wrapper{flex-grow:1;position:relative;background:#03050c;display:flex;justify-content:center;align-items:center;padding:10px;}
canvas{background:#010206;border:2px solid #20e8ff;border-radius:6px;width:100%;height:100%;object-fit:contain;}
.controls{display:flex;justify-content:space-around;padding:10px;background:#070a18;border-top:3px solid #141c38;gap:10px;}
.ctrl-btn{flex-grow:1;height:55px;border:2px solid rgba(255,255,255,.3);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:22px;display:flex;justify-content:center;align-items:center;user-select:none;cursor:pointer;}
.ctrl-btn:active{background:rgba(32,232,255,.35);border-color:#20e8ff;}
.overlay{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:#02030be8;}
.overlay.hidden{display:none;}
.card{width:min(320px,90%);padding:18px;border:3px solid #20e8ff;border-radius:12px;background:#060a1bef;text-align:center;}
.card h2{margin:0 0 8px;color:#ffd42a;font-size:20px;}
.card p{color:#b8eaff;font-size:12px;}
.start-btn{margin-top:12px;width:100%;height:40px;border:2px solid #20e8ff;border-radius:6px;background:#0f2766;color:#fff;font:bold 13px monospace;cursor:pointer;}
.bottom{padding:4px;text-align:center;border-top:2px solid #111a3b;color:#ffd42a;font-size:10px;background:#050716;}
</style>
</head>
<body>
<div class="arcade">
  <div class="marquee"><h1>RETRO JUMPER 🦘</h1></div>
  <div class="screen-wrapper"><canvas id="doodle" width="400" height="500"></canvas></div>
  <div class="controls">
    <div class="ctrl-btn" id="btnLeft">◄</div>
    <div class="ctrl-btn" id="btnRight">►</div>
  </div>
  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="title">JUMPER</h2>
      <p>Прыгай по платформам вверх!<br><br>Стены зеркальные.</p>
      <button class="start-btn" id="startBtn">СТАРТ</button>
    </div>
  </div>
  <footer class="bottom">ВЫШЕ И ВЫШЕ</footer>
</div>
<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const canvas = document.getElementById('doodle'), ctx = canvas.getContext('2d');
let running = false, dir = 0, score = 0;
let player = {x: 185, y: 350, w: 24, h: 24, vx: 0, vy: 0};
let platforms = [];

function initGame() {
  score = 0; player.x = 185; player.y = 350; player.vy = -8;
  platforms = [{x: 160, y: 420, w: 80, h: 12}];
  for(let i=0; i<6; i++) {
    platforms.push({x: Math.random() * 320, y: i * 70 + 40, w: 70, h: 12});
  }
}

function update() {
  if (!running) return;
  player.vx = dir * 4.5;
  player.x += player.vx;
  if (player.x < -10) player.x = canvas.width;
  if (player.x > canvas.width) player.x = -10;

  player.vy += 0.35;
  player.y += player.vy;

  // Платформы
  platforms.forEach(p => {
    if (player.vy > 0 && player.x + player.w > p.x && player.x < p.x + p.w &&
        player.y + player.h >= p.y && player.y + player.h <= p.y + 12) {
      player.vy = -8.5;
    }
  });

  // Прокрутка экрана вверх
  if (player.y < 200) {
    let diff = 200 - player.y;
    player.y = 200;
    score += Math.floor(diff);
    platforms.forEach(p => {
      p.y += diff;
      if (p.y > canvas.height) {
        p.y = 0; p.x = Math.random() * 320;
      }
    });
  }

  if (player.y > canvas.height) {
    running = false;
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('title').textContent = "ПАДЕНИЕ";
    document.getElementById('startBtn').textContent = "ЕЩЕ РАЗ";
  }
}

function draw() {
  ctx.fillStyle = '#010206'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#00ff88'; ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = '#20e8ff'; platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
  ctx.fillStyle = '#fff'; ctx.font = '14px monospace'; ctx.fillText("СЧЕТ: " + score, 15, 25);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

document.getElementById('btnLeft').addEventListener('pointerdown', () => dir = -1);
document.getElementById('btnLeft').addEventListener('pointerup', () => dir = 0);
document.getElementById('btnRight').addEventListener('pointerdown', () => dir = 1);
document.getElementById('btnRight').addEventListener('pointerup', () => dir = 0);
document.getElementById('startBtn').addEventListener('click', () => {
  initGame(); running = true;
  document.getElementById('overlay').classList.add('hidden');
});
loop();
</script>
</body>
</html>
