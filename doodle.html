<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Retro Jumper — FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg-grad: radial-gradient(circle at 50% 20%, rgba(41, 16, 95, 0.9) 0%, rgba(7, 9, 34, 0.95) 50%, rgba(1, 2, 8, 1) 100%);
  --portal-bg: rgba(4, 7, 20, 0.92);
  --border-col: rgba(32, 232, 255, 0.4);
  --accent-col: #20e8ff;
  --title-col: #ffd52c;
  --btn-bg: rgba(10, 16, 40, 0.95);
  --btn-hover: #16368a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{
  padding:4px;display:flex;justify-content:center;align-items:center;
  background: var(--bg-grad); position: fixed; inset: 0;
}
.portal{
  width: 100%; height: 100%; max-width: 480px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; gap: 6px;
  overflow-y: auto; padding: 8px; z-index: 10;
  background: var(--portal-bg); border: 2px solid var(--border-col);
  border-radius: 12px; box-shadow: 0 0 25px rgba(0,0,0,0.8);
  position: relative;
}
.game-ui-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 8px; width: 100%; flex-shrink: 0; }
.back-btn { background: #8c0505; border: 1px solid #ff6b55; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; text-decoration: none; box-shadow: 0 0 8px rgba(255,0,0,0.4); }
.back-btn:active { background: #b30707; transform: scale(0.95); }

#gameContainer { flex-grow: 1; width: 100%; position: relative; background: #010206; border: 2px solid var(--accent-col); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
canvas { width: 100%; height: 100%; object-fit: contain; background: #010206; }

.game-controls { display: flex; gap: 10px; justify-content: center; align-items: center; width: 100%; padding: 4px; flex-shrink: 0; }
.ctrl-pad-btn { background: var(--btn-bg); border: 2px solid var(--accent-col); color: var(--title-col); font-size: 20px; width: 120px; height: 50px; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; user-select: none; box-shadow: 0 3px 8px rgba(0,0,0,0.5); }
.ctrl-pad-btn:active { background: var(--btn-hover); transform: scale(0.92); }
</style>
</head>
<body>

<!-- УНИВЕРСАЛЬНАЯ ПЛАВАЮЩАЯ КНОПКА ВОЗВРАТА В МЕНЮ -->
<div style="position: fixed; top: 10px; left: 10px; z-index: 99999;">
  <a href="index.html" style="display: flex; align-items: center; gap: 4px; background: rgba(140, 5, 5, 0.95); border: 2px solid #ff6b55; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-family: monospace; font-size: 11px; font-weight: bold; box-shadow: 0 0 15px rgba(255,0,0,0.7); -webkit-tap-highlight-color: transparent;">
    ⬅ МЕНЮ
  </a>
</div>

<div class="portal">
  <div class="game-ui-header">
    <div style="width: 60px;"></div>
    <div style="color:var(--title-col); font-size:12px; font-weight:bold;">RETRO JUMPER</div>
    <div style="width: 60px;"></div>
  </div>

  <div id="gameContainer">
    <canvas id="jCanvas" width="360" height="480"></canvas>
  </div>

  <div class="game-controls">
    <button class="ctrl-pad-btn" id="btnLeft">◀ ВЛЕВО</button>
    <button class="ctrl-pad-btn" id="btnRight">ВПРАВО ▶</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
let soundEnabled = localStorage.getItem("freezzzSound") !== "false";
function haptic() {
  if (soundEnabled && tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
  }
}

const canvas = document.getElementById('jCanvas');
const ctx = canvas.getContext('2d');

let player = {
  x: 165,
  y: 300,
  w: 30,
  h: 30,
  vx: 0,
  vy: 0
};

let platforms = [];
let score = 0;
let isMovingLeft = false;
let isMovingRight = false;

// Инициализация платформ
function initGame() {
  platforms = [
    {x: 150, y: 420, w: 70, h: 12},
    {x: 80, y: 320, w: 70, h: 12},
    {x: 220, y: 220, w: 70, h: 12},
    {x: 130, y: 120, w: 70, h: 12},
    {x: 60, y: 20, w: 70, h: 12}
  ];
  player.x = 165;
  player.y = 300;
  player.vx = 0;
  player.vy = -10;
  score = 0;
}

initGame();

// Управление кнопками
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

btnLeft.addEventListener('pointerdown', () => { isMovingLeft = true; });
btnLeft.addEventListener('pointerup', () => { isMovingLeft = false; });
btnLeft.addEventListener('pointerleave', () => { isMovingLeft = false; });

btnRight.addEventListener('pointerdown', () => { isMovingRight = true; });
btnRight.addEventListener('pointerup', () => { isMovingRight = false; });
btnRight.addEventListener('pointerleave', () => { isMovingRight = false; });

// Главный игровой цикл
function update() {
  // Горизонтальное движение
  if (isMovingLeft) player.vx = -4.5;
  else if (isMovingRight) player.vx = 4.5;
  else player.vx *= 0.8;

  player.x += player.vx;

  // Проход сквозь стены по горизонтали
  if (player.x < -player.w) player.x = canvas.width;
  if (player.x > canvas.width) player.x = -player.w;

  // Гравитация и вертикальное движение
  player.vy += 0.35; // Мягкая гравитация для точного расчета прыжка
  player.y += player.vy;

  // Плавное опускание мира, когда игрок поднимается выше середины экрана
  if (player.y < canvas.height / 2) {
    let diff = (canvas.height / 2) - player.y;
    player.y = canvas.height / 2;
    score += Math.floor(diff);
    
    // Платформы опускаются ОЧЕНЬ МЕДЛЕННО и плавно
    platforms.forEach(p => {
      p.y += diff * 0.85; 
    });
  }

  // Генерация новых платформ сверху
  if (platforms[platforms.length - 1].y > 40) {
    let lastP = platforms[platforms.length - 1];
    let newX = Math.random() * (canvas.width - 80);
    // Расстояние по вертикали гарантирует, что прыжка ВСЕГДА хватит до следующей платформы
    let newY = lastP.y - (Math.random() * 45 + 75);
    platforms.push({x: newX, y: newY, w: 70, h: 12});
  }

  // Удаление ушедших вниз платформ
  platforms = platforms.filter(p => p.y < canvas.height + 30);

  // Проверка столкновений с платформами (только при падении вниз)
  if (player.vy > 0) {
    platforms.forEach(p => {
      if (
        player.x + player.w > p.x &&
        player.x < p.x + p.w &&
        player.y + player.h >= p.y &&
        player.y + player.h <= p.y + 15
      ) {
        player.vy = -10.5; // Идеальная сила прыжка до следующей платформы
        haptic();
      }
    });
  }

  // Проверка проигрыша (падение ниже экрана)
  if (player.y > canvas.height) {
    let best = Number(localStorage.getItem("doodleBest") || 0);
    if (score > best) localStorage.setItem("doodleBest", score);
    alert("Игра окончена! Счёт: " + score);
    initGame();
  }
}

function draw() {
  ctx.fillStyle = '#010206';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Отрисовка платформ (неоновые зеленые)
  ctx.fillStyle = '#00ff88';
  platforms.forEach(p => {
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#00ff88';
    ctx.fillRect(p.x, p.y, p.w, p.h);
  });
  ctx.shadowBlur = 0;

  // Отрисовка игрока (желтый неоновый кубик/герой)
  ctx.fillStyle = '#ffd52c';
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#ffd52c';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.shadowBlur = 0;

  // Отрисовка счета
  ctx.fillStyle = '#20e8ff';
  ctx.font = 'bold 14px monospace';
  ctx.fillText("СЧЕТ: " + score, 15, 25);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
