<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Утиная охота</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #87CEEB; /* Цвет неба */
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            cursor: crosshair; /* Прицел вместо курсора */
            user-select: none;
        }

        /* Игровое поле (небо + земля) */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Земля внизу */
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 15vh;
            background: #228B22;
            border-top: 5px solid #006400;
        }

        /* Панель с очками */
        #scoreboard {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px #000;
            z-index: 10;
        }

        /* Утка */
        .duck {
            position: absolute;
            width: 80px;
            height: 80px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            /* Используем эмодзи или простую картинку утки */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text y="20" font-size="20">🦆</text></svg>');
            cursor: crosshair;
            transition: transform 0.1s;
        }

        /* Экран окончания игры */
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 10px;
            color: white;
            z-index: 100;
        }

        #game-over h1 {
            margin-top: 0;
            font-size: 40px;
            color: #ff4444;
        }

        #restart-btn {
            padding: 10px 20px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #restart-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="scoreboard">Счет: <span id="score">0</span> | Промахи: <span id="misses">0</span>/5</div>
        <div id="ground"></div>
        
        <div id="game-over">
            <h1>Игра окончена!</h1>
            <p>Ваш итоговый счет: <span id="final-score">0</span></p>
            <button id="restart-btn" onclick="startGame()">Играть снова</button>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const missesDisplay = document.getElementById('misses');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');

        let score = 0;
        let misses = 0;
        let gameInterval;
        let duckSpeed = 3;
        let isPlaying = false;

        function startGame() {
            // Очищаем старых уток
            document.querySelectorAll('.duck').forEach(d => d.remove());
            
            score = 0;
            misses = 0;
            duckSpeed = 3;
            isPlaying = true;
            scoreDisplay.textContent = score;
            missesDisplay.textContent = misses;
            gameOverScreen.style.display = 'none';

            // Запускаем спаун уток
            clearInterval(gameInterval);
            gameInterval = setInterval(spawnDuck, 1200);
        }

        function spawnDuck() {
            if (!isPlaying) return;

            const duck = document.createElement('div');
            duck.classList.add('duck');

            // Случайная стартовая позиция по вертикали (не выше верха и не ниже земли)
            const minY = 50;
            const maxY = window.innerHeight * 0.75 - 80;
            let y = Math.random() * (maxY - minY) + minY;
            
            // Утка появляется слева или справа
            let x, direction;
            if (Math.random() > 0.5) {
                x = -80;
                direction = 1; // летит вправо
                duck.style.transform = 'scaleX(1)';
            } else {
                x = window.innerWidth;
                direction = -1; // летит влево
                duck.style.transform = 'scaleX(-1)';
            }

            duck.style.left = x + 'px';
            duck.style.top = y + 'px';

            // Клик по утке (выстрел)
            duck.addEventListener('mousedown', (e) => {
                e.stopPropagation(); // чтобы клик не засчитывался как промах по фону
                if (!isPlaying) return;

                score += 10;
                scoreDisplay.textContent = score;

                // Усложняем игру каждые 50 очков
                if (score % 50 === 0) {
                    duckSpeed += 0.5;
                }

                // Эффект попадания (падение вниз)
                duck.style.backgroundImage = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text y="20" font-size="20">💥</text></svg>')`;
                
                let fallInterval = setInterval(() => {
                    y += 10;
                    duck.style.top = y + 'px';
                    if (y > window.innerHeight) {
                        clearInterval(fallInterval);
                        duck.remove();
                    }
                }, 20);

                // Убираем старый обработчик, чтобы нельзя было кликнуть повторно
                duck.replaceWith(duck.cloneNode(true));
            });

            gameContainer.appendChild(duck);

            // Движение утки
            let currentX = x;
            let moveInterval = setInterval(() => {
                if (!isPlaying) {
                    clearInterval(moveInterval);
                    return;
                }

                currentX += duckSpeed * direction;
                duck.style.left = currentX + 'px';

                // Если утка улетела за пределы экрана
                if ((direction === 1 && currentX > window.innerWidth) || 
                    (direction === -1 && currentX < -80)) {
                    clearInterval(moveInterval);
                    duck.remove();
                    
                    // Засчитываем промах, если утка не была подбита (проверяем по эмодзи)
                    if (!duck.innerHTML.includes('💥')) {
                        misses++;
                        missesDisplay.textContent = misses;
                        if (misses >= 5) {
                            endGame();
                        }
                    }
                }
            }, 20);
        }

        // Клик мимо утки (промах)
        gameContainer.addEventListener('mousedown', () => {
            if (!isPlaying) return;
            // Можно добавить звук выстрела или эффект, если захочешь
        });

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'block';
        }

        // Автоматически запускаем игру при загрузке
        window.onload = startGame;
    </script>
</body>
</html>
