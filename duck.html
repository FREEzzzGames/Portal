<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Duck Mudack — FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg-grad: radial-gradient(circle at 50% 20%, rgba(41, 16, 95, 0.9) 0%, rgba(7, 9, 34, 0.95) 50%, rgba(1, 2, 8, 1) 100%);
  --portal-bg: rgba(4, 7, 20, 0.92);
  --border-col: rgba(32, 232, 255, 0.4);
  --accent-col: #20e8ff;
  --title-col: #ffd52c;
  --btn-bg: rgba(16, 26, 60, 0.95);
  --btn-hover: #213c8f;
  --glass-bg: rgba(32, 232, 255, 0.08);
  --neon-glow: rgba(32, 232, 255, 0.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{
  padding:4px;display:flex;justify-content:center;align-items:center;
  background: var(--bg-grad); position: fixed; inset: 0;
}
.portal{
  width: 100%; height: 100%; max-width: 420px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; gap: 6px;
  overflow-y: auto; padding: 8px; z-index: 10;
  background: var(--portal-bg); border: 2px solid var(--border-col);
  border-radius: 12px; box-shadow: 0 0 25px rgba(0,0,0,0.8);
  position: relative;
}
.game-ui-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 8px; width: 100%; flex-shrink: 0; font-size: 11px; }

#gameContainer { flex-grow: 1; width: 100%; position: relative; background: #050b1a; border: 2px solid var(--accent-col); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; cursor: crosshair; }
canvas { width: 100%; height: 100%; object-fit: contain; background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d); }

.game-info-footer { display: flex; justify-content: space-around; padding: 6px; background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 8px; font-size: 10px; flex-shrink: 0; }
</style>
</head>
<body>

<!-- УНИВЕРСАЛЬНАЯ ПЛАВАЮЩАЯ КНОПКА ВОЗВРАТА В МЕНЮ -->
<div style="position: fixed; top: 10px; left: 10px; z-index: 99999;">
  <a href="index.html" style="display: flex; align-items: center; gap: 4px; background: rgba(140, 5, 5, 0.95); border: 2px solid #ff6b55; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-family: monospace; font-size: 11px; font-weight: bold; box-shadow: 0 0 15px rgba(255,0,0,0.7); -webkit-tap-highlight-color: transparent;">
    ⬅ МЕНЮ
  </a>
</div>

<div class="portal">
  <div class="game-ui-header">
    <div id="scoreTxt" style="color:var(--title-col);">СЧЕТ: 0</div>
    <div id="speedTxt" style="color:var(--accent-col);">СКОРОСТЬ: 1/10</div>
  </div>

  <div id="gameContainer">
    <canvas id="dCanvas" width="360" height="420"></canvas>
  </div>

  <div class="game-info-footer">
    <span style="color:var(--title-col);">ТАПАЙ ПО УТКАМ ДЛЯ ВЫСТРЕЛА! 🎯</span>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
let soundEnabled = localStorage.getItem("freezzzSound") !== "false";

let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

// Звук выстрела
function playShootSound() {
  if (!soundEnabled) return;
  try {
    let ctx = getAudioContext();
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 0.15);

    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch(e) {}
}

// Звук кряканья утки при попадании
function playQuackSound() {
  if (!soundEnabled) return;
  try {
    let ctx = getAudioContext();
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(300, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(180, ctx.currentTime + 0.1);
    osc.frequency.linearRampToValueAtTime(250, ctx.currentTime + 0.2);

    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.25);
  } catch(e) {}
}

function haptic() {
  if (soundEnabled && tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred('medium'); } catch(e){}
  }
}

const canvas = document.getElementById('dCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let ducks = [];

class Duck {
  constructor() {
    this.reset();
  }
  reset() {
    this.w = 36;
    this.h = 28;
    this.x = Math.random() < 0.5 ? -40 : canvas.width + 10;
    this.y = Math.random() * (canvas.height - 180) + 40;
    
    // Скорость зависит от текущего уровня сложности (от 1 до 10)
    let speedLevel = Math.min(10, Math.floor(score / 10000) + 1);
    let baseSpeed = 1.2 + (speedLevel * 0.4);
    
    this.vx = (this.x < 0) ? baseSpeed : -baseSpeed;
    this.vy = (Math.random() - 0.5) * 1.0;
    this.isDead = false;
    this.fallAnim = 0;
  }
  update() {
    if (!this.isDead) {
      this.x += this.vx;
      this.y += this.vy;
      if (this.y < 20 || this.y > canvas.height - 100) this.vy *= -1;

      // Возврат при выходе за границы
      if ((this.vx > 0 && this.x > canvas.width + 40) || (this.vx < 0 && this.x < -40)) {
        this.reset();
      }
    } else {
      this.fallAnim += 4;
      this.y += this.fallAnim;
      if (this.y > canvas.height + 40) {
        this.reset();
      }
    }
  }
  draw() {
    ctx.font = '26px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let emoji = this.isDead ? '🍖' : (this.vx > 0 ? '🦆' : '🐥');
    ctx.fillText(emoji, this.x, this.y);
  }
}

// Создаем стаю из 3 уток
for (let i = 0; i < 3; i++) {
  ducks.push(new Duck());
}

// Обработка клика/выстрела по холсту
canvas.addEventListener('pointerdown', (e) => {
  let rect = canvas.getBoundingClientRect();
  let clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
  let clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

  playShootSound();
  haptic();

  let hit = false;
  ducks.forEach(duck => {
    if (!duck.isDead && Math.abs(clickX - duck.x) < 25 && Math.abs(clickY - duck.y) < 25) {
      duck.isDead = true;
      duck.vx = 0;
      duck.vy = 0;
      score += 1000;
      hit = true;
      playQuackSound();
    }
  });

  let speedLevel = Math.min(10, Math.floor(score / 10000) + 1);
  document.getElementById('scoreTxt').textContent = "СЧЕТ: " + score;
  document.getElementById('speedTxt').textContent = `СКОРОСТЬ: ${speedLevel}/10`;
});

function gameLoop() {
  ctx.fillStyle = '#050b1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Рисуем задний фон (небо и холмы)
  ctx.fillStyle = '#112244';
  ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
  ctx.fillStyle = '#22aa44';
  ctx.beginPath();
  ctx.arc(100, canvas.height - 40, 90, Math.PI, 0, false);
  ctx.arc(280, canvas.height - 30, 110, Math.PI, 0, false);
  ctx.fill();

  ducks.forEach(duck => {
    duck.update();
    duck.draw();
  });

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
