<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Duck Mudack — FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg-grad: radial-gradient(circle at 50% 20%, rgba(41, 16, 95, 0.9) 0%, rgba(7, 9, 34, 0.95) 50%, rgba(1, 2, 8, 1) 100%);
  --portal-bg: rgba(4, 7, 20, 0.92);
  --border-col: rgba(32, 232, 255, 0.4);
  --accent-col: #20e8ff;
  --title-col: #ffd52c;
  --btn-bg: rgba(16, 26, 60, 0.95);
  --btn-hover: #213c8f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{
  padding:4px;display:flex;justify-content:center;align-items:center;
  background: var(--bg-grad); position: fixed; inset: 0;
}
.portal{
  width: 100%; height: 100%; max-width: 480px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; gap: 6px;
  overflow-y: auto; padding: 8px; z-index: 10;
  background: var(--portal-bg); border: 2px solid var(--border-col);
  border-radius: 12px; box-shadow: 0 0 25px rgba(0,0,0,0.8);
  position: relative;
}
.game-ui-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 8px; width: 100%; flex-shrink: 0; }

#gameContainer { flex-grow: 1; width: 100%; position: relative; background: #010206; border: 2px solid var(--accent-col); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; cursor: crosshair; }
canvas { width: 100%; height: 100%; object-fit: contain; background: #010206; }
</style>
</head>
<body>

<div style="position: fixed; top: 10px; left: 10px; z-index: 99999;">
  <a href="index.html" style="display: flex; align-items: center; gap: 4px; background: rgba(140, 5, 5, 0.95); border: 2px solid #ff6b55; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-family: monospace; font-size: 11px; font-weight: bold; box-shadow: 0 0 15px rgba(255,0,0,0.7); -webkit-tap-highlight-color: transparent;">
    ⬅ МЕНЮ
  </a>
</div>

<div class="portal">
  <div class="game-ui-header">
    <div style="width: 50px;"></div>
    <div style="color:var(--title-col); font-size:12px; font-weight:bold;" id="scoreTxt">СЧЕТ: 0</div>
    <div id="speedTxt" style="color:var(--accent-col); font-size:10px;">СКОРОСТЬ: 1/10</div>
  </div>

  <div id="gameContainer">
    <canvas id="duckCanvas" width="360" height="480"></canvas>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
let soundEnabled = localStorage.getItem("freezzzSound") !== "false";

let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playShootSound() {
  if (!soundEnabled) return;
  try {
    let ctx = getAudioContext();
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 0.15);

    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch(e) {}
}

function playQuackSound() {
  if (!soundEnabled) return;
  try {
    let ctx = getAudioContext();
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(300, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(180, ctx.currentTime + 0.1);
    osc.frequency.linearRampToValueAtTime(250, ctx.currentTime + 0.2);

    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.25);
  } catch(e) {}
}

function haptic() {
  if (soundEnabled && tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred('medium'); } catch(e){}
  }
}

const canvas = document.getElementById('duckCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let ducks = [];

class Duck {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() < 0.5 ? -30 : canvas.width + 30;
    this.y = Math.random() * 250 + 40;
    
    let speedLevel = Math.min(10, Math.floor(score / 10000) + 1);
    let baseSpeed = 0.8 + (speedLevel * 0.3);
    
    this.vx = (this.x < 0) ? baseSpeed : -baseSpeed;
    this.vy = (Math.random() - 0.5) * 0.6;
    this.hit = false;
    this.fallTimer = 0;
  }
  update() {
    if (!this.hit) {
      this.x += this.vx;
      this.y += this.vy;
      if (this.y < 30 || this.y > 320) this.vy *= -1;

      if ((this.vx > 0 && this.x > canvas.width + 30) || (this.vx < 0 && this.x < -30)) {
        this.reset();
      }
    } else {
      this.fallTimer += 3;
      this.y += this.fallTimer;
      if (this.y > canvas.height + 40) {
        this.reset();
      }
    }
  }
  draw() {
    ctx.font = '24px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.hit ? '🎯' : '🦆', this.x, this.y);
  }
}

for (let i = 0; i < 3; i++) {
  ducks.push(new Duck());
}

canvas.addEventListener('pointerdown', (e) => {
  let rect = canvas.getBoundingClientRect();
  let clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
  let clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

  playShootSound();
  haptic();

  ducks.forEach(d => {
    if (!d.hit && Math.abs(clickX - d.x) < 22 && Math.abs(clickY - d.y) < 22) {
      d.hit = true;
      d.vx = 0;
      d.vy = 0;
      score += 1000;
      playQuackSound();
    }
  });

  let speedLevel = Math.min(10, Math.floor(score / 10000) + 1);
  document.getElementById('scoreTxt').textContent = "СЧЕТ: " + score;
  document.getElementById('speedTxt').textContent = `СКОРОСТЬ: ${speedLevel}/10`;
});

function gameLoop() {
  ctx.fillStyle = '#010206';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ducks.forEach(d => {
    d.update();
    d.draw();
  });

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
