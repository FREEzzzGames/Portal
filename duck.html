<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ретро Аркада: Утиная Охота</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #111;
            overflow: hidden;
            font-family: 'Press Start 2P', monospace;
            cursor: crosshair;
            user-select: none;
        }

        /* Корпус аркадного автомата */
        #arcade-cabinet {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #87CEEB; /* Небо */
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            border: 15px solid #2c1d0c;
            box-sizing: border-box;
        }

        /* Земля */
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 18vh;
            background: #228B22;
            border-top: 6px solid #134d13;
            z-index: 2;
        }

        /* Верхняя панель (счет, патроны) */
        #marquee {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            color: #ffeb3b;
            text-shadow: 3px 3px #000;
            font-size: 16px;
            z-index: 10;
        }

        .hud-block {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border: 3px solid #ff9800;
            border-radius: 5px;
        }

        /* Утка */
        .duck {
            position: absolute;
            width: 80px;
            height: 80px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text y="20" font-size="20">🦆</text></svg>');
            cursor: crosshair;
            z-index: 3;
            transition: transform 0.1s;
        }

        /* Ружье внизу экрана (вид от первого лица) */
        #gun-container {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 250px;
            pointer-events: none; /* Чтобы клики проходили сквозь ружье */
            z-index: 20;
            transition: transform 0.05s ease-out;
            transform-origin: bottom center;
        }

        #gun {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom center;
            /* Векторное ретро-ружье аркадного автомата */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150"><path d="M85 150 L95 40 L105 40 L115 150 Z" fill="%234a3525"/><rect x="80" y="30" width="40" height="20" fill="%23222"/><rect x="92" y="10" width="16" height="30" fill="%23111"/><circle cx="100" cy="20" r="4" fill="%23ff5555"/></svg>');
        }

        /* Вспышка выстрела */
        #flash {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ffff00 0%, #ff4500 60%, transparent 100%);
            border-radius: 50%;
            transition: transform 0.05s ease-out;
            z-index: 21;
        }

        #flash.active {
            transform: translateX(-50%) scale(1.5);
        }

        /* Экран GameOver / Insert Coin */
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid #ff4444;
            padding: 40px;
            border-radius: 10px;
            color: white;
            z-index: 100;
        }

        #game-over h1 {
            color: #ff4444;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 2px 2px #550000;
        }

        #restart-btn {
            margin-top: 20px;
            padding: 15px 30px;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            background-color: #4CAF50;
            color: white;
            border: 3px solid #fff;
            cursor: pointer;
            box-shadow: 0 5px 0 #2e6b31;
        }

        #restart-btn:hover {
            background-color: #45a049;
        }

        #restart-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #2e6b31;
        }
    </style>
</head>
<body>

    <div id="arcade-cabinet">
        <!-- Информационная панель -->
        <div id="marquee">
            <div class="hud-block">СЧЕТ: <span id="score">0</span></div>
            <div class="hud-block">ПАТРОНЫ: <span id="ammo">3</span>/3</div>
            <div class="hud-block">ПРОМАХИ: <span id="misses">0</span>/5</div>
        </div>

        <div id="ground"></div>

        <!-- Ружье игрока -->
        <div id="gun-container">
            <div id="flash"></div>
            <div id="gun"></div>
        </div>

        <!-- Экран поражения -->
        <div id="game-over">
            <h1>ИГРА ОКОНЧЕНА</h1>
            <p>РЕЗУЛЬТАТ: <span id="final-score">0</span></p>
            <p style="font-size: 10px; color: #aaa; margin-top: 15px;">НАЖМИТЕ КНОПКУ, ЧТОБЫ ИГРАТЬ СНОВА</p>
            <button id="restart-btn" onclick="startGame()">ИГРАТЬ СНОВА</button>
        </div>
    </div>

    <script>
        const arcade = document.getElementById('arcade-cabinet');
        const scoreDisplay = document.getElementById('score');
        const ammoDisplay = document.getElementById('ammo');
        const missesDisplay = document.getElementById('misses');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const gunContainer = document.getElementById('gun-container');
        const flash = document.getElementById('flash');

        let score = 0;
        let ammo = 3;
        let maxAmmo = 3;
        let misses = 0;
        let gameInterval;
        let duckSpeed = 2.5;
        let isPlaying = false;

        // Плавное слежение ружья за курсором мыши
        document.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            const xPos = (e.clientX / window.innerWidth) - 0.5; // от -0.5 до 0.5
            // Наклоняем ружье в зависимости от положения мыши
            gunContainer.style.transform = `translateX(calc(-50% + ${xPos * 150}px)) rotate(${xPos * 25}deg)`;
        });

        function startGame() {
            document.querySelectorAll('.duck').forEach(d => d.remove());
            
            score = 0;
            ammo = maxAmmo;
            misses = 0;
            duckSpeed = 2.5;
            isPlaying = true;
            
            scoreDisplay.textContent = score;
            ammoDisplay.textContent = ammo;
            missesDisplay.textContent = misses;
            gameOverScreen.style.display = 'none';

            clearInterval(gameInterval);
            gameInterval = setInterval(spawnDuck, 1400);
        }

        function spawnDuck() {
            if (!isPlaying) return;

            const duck = document.createElement('div');
            duck.classList.add('duck');

            const minY = 60;
            const maxY = window.innerHeight * 0.7 - 80;
            let y = Math.random() * (maxY - minY) + minY;
            
            let x, direction;
            if (Math.random() > 0.5) {
                x = -80;
                direction = 1; 
                duck.style.transform = 'scaleX(1)';
            } else {
                x = window.innerWidth;
                direction = -1; 
                duck.style.transform = 'scaleX(-1)';
            }

            duck.style.left = x + 'px';
            duck.style.top = y + 'px';

            // Клик по утке (попадание)
            duck.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                if (!isPlaying || ammo <= 0) return;

                score += 15;
                scoreDisplay.textContent = score;

                if (score % 60 === 0) {
                    duckSpeed += 0.5;
                }

                // Взрыв утки
                duck.style.backgroundImage = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text y="20" font-size="20">💥</text></svg>')`;
                
                let fallInterval = setInterval(() => {
                    y += 12;
                    duck.style.top = y + 'px';
                    if (y > window.innerHeight) {
                        clearInterval(fallInterval);
                        duck.remove();
                    }
                }, 20);

                duck.replaceWith(duck.cloneNode(true));
            });

            arcade.appendChild(duck);

            let currentX = x;
            let moveInterval = setInterval(() => {
                if (!isPlaying) {
                    clearInterval(moveInterval);
                    return;
                }

                currentX += duckSpeed * direction;
                duck.style.left = currentX + 'px';

                if ((direction === 1 && currentX > window.innerWidth) || 
                    (direction === -1 && currentX < -80)) {
                    clearInterval(moveInterval);
                    duck.remove();
                    
                    if (!duck.innerHTML.includes('💥')) {
                        misses++;
                        missesDisplay.textContent = misses;
                        if (misses >= 5) {
                            endGame();
                        }
                    }
                }
            }, 20);
        }

        // Клик по экрану (выстрел / трата патрона / перезарядка кликом в пустоту)
        arcade.addEventListener('mousedown', () => {
            if (!isPlaying) return;

            // Эффект выстрела
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 50);

            // Отдача ружья
            gunContainer.style.bottom = '-35px';
            setTimeout(() => gunContainer.style.bottom = '-20px', 50);

            if (ammo > 0) {
                ammo--;
                ammoDisplay.textContent = ammo;
                
                // Если патроны закончились, автоматически перезаряжаем через 0.4 сек
                if (ammo === 0) {
                    setTimeout(() => {
                        if (isPlaying) {
                            ammo = maxAmmo;
                            ammoDisplay.textContent = ammo;
                        }
                    }, 400);
                }
            }
        });

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'block';
        }

        window.onload = startGame;
    </script>
</body>
</html>
