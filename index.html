<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FREEzzzGames — Arcade Cabinet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --cabinet-body: #0b0d19;
  --cabinet-border: #18224c;
  --bg-grad: linear-gradient(135deg, #050711 0%, #120926 50%, #03040a 100%);
  --screen-bg: #010206;
  --border-col: #20e8ff;
  --accent-col: #20e8ff;
  --title-col: #ffd52c;
  --btn-bg: rgba(16, 26, 60, 0.95);
  --btn-hover: #213c8f;
  --neon-glow: rgba(32, 232, 255, 0.35);
}
body.theme-matrix {
  --cabinet-body: #041209;
  --cabinet-border: #0d381c;
  --bg-grad: linear-gradient(135deg, #020904 0%, #092614 50%, #010502 100%);
  --screen-bg: #010502;
  --border-col: #00ff88;
  --accent-col: #00ff88;
  --title-col: #00ff88;
  --btn-bg: rgba(8, 38, 18, 0.95);
  --btn-hover: #135c2e;
  --neon-glow: rgba(0, 255, 136, 0.35);
}
body.theme-fire {
  --cabinet-body: #140705;
  --cabinet-border: #401410;
  --bg-grad: linear-gradient(135deg, #0d0403 0%, #2b0b08 100%);
  --screen-bg: #050201;
  --border-col: #ff6b30;
  --accent-col: #ff6b30;
  --title-col: #ffd52c;
  --btn-bg: rgba(40, 14, 10, 0.95);
  --btn-hover: #802219;
  --neon-glow: rgba(255, 107, 48, 0.35);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#010206;color:#fff;font-family:monospace;overflow:hidden;}
body{
  padding:6px;display:flex;justify-content:center;align-items:center;
  background: var(--bg-grad); position: fixed; inset: 0;
}

/* КОРПУС АРКАДНОГО АВТОМАТА */
.arcade-cabinet {
  width: 100%; height: 100%; max-width: 440px; max-height: 100vh;
  background: var(--cabinet-body);
  border: 4px solid var(--cabinet-border);
  border-radius: 20px;
  box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 25px rgba(0,0,0,0.8);
  display: flex; flex-direction: column; padding: 10px; gap: 8px;
  position: relative; overflow: hidden;
}

/* ВЕРХНЯЯ ВЫВЕСКА (MARQUEE) */
.arcade-marquee {
  background: rgba(0,0,0,0.6);
  border: 2px solid var(--border-col);
  border-radius: 10px;
  padding: 6px;
  text-align: center;
  box-shadow: 0 0 15px var(--neon-glow);
  flex-shrink: 0;
}
.marquee-title {
  color: var(--title-col);
  font-size: 20px;
  font-weight: bold;
  margin: 0;
  text-shadow: 2px 2px #ff0055, 0 0 10px var(--title-col);
  letter-spacing: 3px;
}
.marquee-sub {
  color: var(--accent-col);
  font-size: 8px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-top: 2px;
}

/* ПРОФИЛЬ И ПАНЕЛЬ УПРАВЛЕНИЯ НА КОРПУСЕ */
.cabinet-top-panel {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(0,0,0,0.4); border: 1px solid var(--border-col);
  border-radius: 8px; padding: 4px 8px; flex-shrink: 0;
}
.profile-box {
  font-size: 10px; color: var(--accent-col); display: flex; align-items: center; gap: 6px;
  cursor: pointer; background: var(--btn-bg); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-col);
}
.profile-box:active { background: var(--btn-hover); }
.user-avatar { width: 22px; height: 22px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 13px; border: 1px solid var(--accent-col); }

.cabinet-btns { display: flex; gap: 6px; }
.cab-btn {
  background: var(--btn-bg); border: 1px solid var(--border-col); color: var(--title-col);
  padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
}

/* ЭМУЛЯЦИЯ ЭКРАНА АВТОМАТА (CRT МОНИТОР) */
.arcade-screen {
  flex-grow: 1; background: var(--screen-bg);
  border: 4px inset var(--cabinet-border);
  border-radius: 12px;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 0 10px var(--neon-glow);
  display: flex; flex-direction: column; padding: 8px; gap: 6px;
  overflow-y: auto; position: relative;
}
/* Сканлинии ЭЛТ экрана */
.arcade-screen::after {
  content: " "; display: block; position: absolute; inset: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
  background-size: 100% 3px; z-index: 50; pointer-events: none; opacity: 0.6;
}

/* СПЕЦ-КНОПКИ НА ЭКРАНЕ */
.actions-row { display: flex; gap: 6px; justify-content: center; flex-shrink: 0; z-index: 55; }
.action-btn {
  background: var(--btn-bg); border: 2px solid var(--border-col); color: var(--title-col);
  padding: 6px 12px; border-radius: 6px; font: bold 9px monospace; cursor: pointer;
  box-shadow: 0 0 8px var(--neon-glow); transition: .15s;
}
.action-btn:active { background: var(--btn-hover); transform: scale(0.95); }

/* СЕТКА ИКОНОК 3x4 НА ЭКРАНЕ */
.grid-menu { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 8px; flex-grow: 1; z-index: 55; }
.icon-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  aspect-ratio: 1/1; border: 2px solid var(--accent-col); border-radius: 10px;
  background: var(--btn-bg); color: #fff; text-decoration: none; cursor: pointer;
  box-shadow: 0 0 8px var(--neon-glow); transition: .15s; padding: 4px; gap: 2px;
}
.icon-btn:active { transform: scale(.92); background: var(--btn-hover); border-color: var(--title-col); }
.icon-emoji { font-size: 26px; filter: drop-shadow(0 0 4px var(--accent-col)); }
.icon-title { font-size: 8px; font-weight: bold; color: var(--title-col); text-align: center; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* ПАНЕЛЬ УПРАВЛЕНИЯ ВНИЗУ АВТОМАТА (КОНСОЛЬ) */
.arcade-deck {
  background: linear-gradient(to bottom, #111526, #070912);
  border: 2px solid var(--cabinet-border);
  border-radius: 10px;
  padding: 8px;
  display: flex; justify-content: space-around; align-items: center;
  flex-shrink: 0; box-shadow: inset 0 2px 5px rgba(255,255,255,0.05);
}
.joystick-mock {
  width: 36px; height: 36px; background: radial-gradient(circle at 35% 35%, #ff3366, #880022);
  border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.4);
  position: relative;
}
.arcade-buttons-mock { display: flex; gap: 8px; align-items: center; }
.arcade-btn-red {
  width: 28px; height: 28px; background: radial-gradient(circle at 35% 35%, #ff4444, #990000);
  border-radius: 50%; box-shadow: 0 3px 6px rgba(0,0,0,0.8), inset 0 2px 3px rgba(255,255,255,0.4);
  cursor: pointer;
}
.arcade-btn-red:active { transform: scale(0.9); }
.arcade-btn-yellow {
  width: 28px; height: 28px; background: radial-gradient(circle at 35% 35%, #ffdd00, #997700);
  border-radius: 50%; box-shadow: 0 3px 6px rgba(0,0,0,0.8), inset 0 2px 3px rgba(255,255,255,0.4);
  cursor: pointer;
}
.arcade-btn-yellow:active { transform: scale(0.9); }

/* МОДАЛЬНОЕ ОКНО АВАТАРОВ */
.modal-overlay { position: absolute; inset: 0; background: rgba(2,3,11,0.9); z-index: 100; display: flex; justify-content: center; align-items: center; padding: 15px; }
.modal-card { background: var(--cabinet-body); border: 2px solid var(--border-col); border-radius: 12px; width: 100%; max-width: 320px; padding: 14px; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.9); display: flex; flex-direction: column; gap: 8px; z-index: 101; }
.avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-height: 180px; overflow-y: auto; padding: 2px; }
.avatar-item { aspect-ratio: 1/1; background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; }
.avatar-item.active { border-color: var(--title-col); box-shadow: 0 0 8px var(--title-col); }

.footer-info { color: #83a4c9; font-size: 8px; letter-spacing: 1px; text-align: center; flex-shrink: 0; }
</style>
</head>
<body id="bodyRoot">

<div class="arcade-cabinet">
  <!-- ВЫВЕСКА АРКАДЫ (MARQUEE) -->
  <div class="arcade-marquee">
    <h1 class="marquee-title">FREEzzzGAMES</h1>
    <div class="marquee-sub">ARCADE CABINET 🕹️ v2.0</div>
  </div>

  <!-- ШАПКА КАБИНЕТА (ПРОФИЛЬ И ТЕМЫ) -->
  <div class="cabinet-top-panel">
    <div class="profile-box" onclick="openAvatarModal()">
      <div class="user-avatar" id="currentAvatarEmoji">👾</div>
      <div id="userNameTxt">Игрок</div>
    </div>
    <div class="cabinet-btns">
      <button class="cab-btn" onclick="toggleTheme()" title="Сменить тему">🎨</button>
      <button class="cab-btn" id="soundToggle" onclick="toggleSound()">🔊</button>
    </div>
  </div>

  <!-- ЭКРАН ЭЛТ (CRT МОНИТОР С ИГРАМИ) -->
  <div class="arcade-screen">
    <div class="actions-row">
      <button class="action-btn" onclick="playRandomGame()">🎲 РАНДОМ</button>
      <button class="action-btn" onclick="sharePortal()">📤 ДРУЗЬЯМ</button>
    </div>

    <!-- Сетка иконок 3x4 -->
    <div class="grid-menu">
      <a href="snake.html" class="icon-btn"><div class="icon-emoji">🐍</div><div class="icon-title">SNAKE</div></a>
      <a href="tetris.html" class="icon-btn"><div class="icon-emoji">🧱</div><div class="icon-title">TETRIS</div></a>
      <a href="pong.html" class="icon-btn"><div class="icon-emoji">🏓</div><div class="icon-title">PONG</div></a>
      <a href="race.html" class="icon-btn"><div class="icon-emoji">🏎️</div><div class="icon-title">RACER</div></a>
      <a href="mario.html" class="icon-btn"><div class="icon-emoji">🍄</div><div class="icon-title">PLATFORMER</div></a>
      <a href="arkanoid.html" class="icon-btn"><div class="icon-emoji">🧱</div><div class="icon-title">ARKANOID</div></a>
      <a href="duck.html" class="icon-btn"><div class="icon-emoji">🦆</div><div class="icon-title">DUCK MUDACK</div></a>
      <a href="invaders.html" class="icon-btn"><div class="icon-emoji">👾</div><div class="icon-title">INVADERS</div></a>
      <a href="doodle.html" class="icon-btn"><div class="icon-emoji">🦘</div><div class="icon-title">JUMPER</div></a>
      <a href="minesweeper.html" class="icon-btn"><div class="icon-emoji">💣</div><div class="icon-title">MINESWEEPER</div></a>
      <div class="icon-btn" style="opacity:0.5; cursor:default;"><div class="icon-emoji">⏳</div><div class="icon-title">SOON...</div></div>
      <div class="icon-btn" style="opacity:0.5; cursor:default;"><div class="icon-emoji">⏳</div><div class="icon-title">SOON...</div></div>
    </div>
  </div>

  <!-- ПАНЕЛЬ УПРАВЛЕНИЯ (КНОПКИ И ДЖОЙСТИК ВНИЗУ АВТОМАТА) -->
  <div class="arcade-deck">
    <div class="joystick-mock" onclick="playRandomGame()" title="Джойстик"></div>
    <div class="footer-info">COIN INSERTED • PRESS GAME</div>
    <div class="arcade-buttons-mock">
      <div class="arcade-btn-red" onclick="playRandomGame()" title="Кнопка А"></div>
      <div class="arcade-btn-yellow" onclick="toggleTheme()" title="Кнопка B"></div>
    </div>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО КОЛЛЕКЦИИ АВАТАРОВ -->
<div class="modal-overlay hidden" id="avatarModal">
  <div class="modal-card">
    <h3 style="color:var(--title-col); margin:0; font-size:13px;">КОЛЛЕКЦИЯ АВАТАРОВ</h3>
    <p style="font-size:9px; color:#83a4c9; margin:0;">Выбирай аватарку или заходи ежедневно за новой!</p>
    <div class="avatar-grid" id="avatarGrid"></div>
    <button class="action-btn" style="width:100%; justify-content:center; padding:8px;" onclick="closeAvatarModal()">ЗАКРЫТЬ</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
let userName = "Игрок";
if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) {
  userName = tg.initDataUnsafe.user.first_name;
}
document.getElementById('userNameTxt').textContent = userName;

// АВАТАРЫ
const possibleAvatars = ["👾", "🤖", "👽", "🦊", "🐯", "🐼", "🦄", "🐲", "👻", "💀", "👑", "🚀", "⚡", "💎", "🕹️", "🔥"];
let userAvatars = JSON.parse(localStorage.getItem("freezzzAvatars") || '["👾"]');
let currentAvatar = localStorage.getItem("freezzzCurrentAvatar") || userAvatars[0];

const todayStr = new Date().toDateString();
if (localStorage.getItem("freezzzLastAvatarDate") !== todayStr) {
  const randomNew = possibleAvatars[Math.floor(Math.random() * possibleAvatars.length)];
  if (!userAvatars.includes(randomNew)) {
    userAvatars.push(randomNew);
    localStorage.setItem("freezzzAvatars", JSON.stringify(userAvatars));
  }
  localStorage.setItem("freezzzLastAvatarDate", todayStr);
}
document.getElementById('currentAvatarEmoji').textContent = currentAvatar;

function openAvatarModal() {
  haptic();
  const grid = document.getElementById('avatarGrid');
  grid.innerHTML = userAvatars.map(av => `
    <div class="avatar-item ${av === currentAvatar ? 'active' : ''}" onclick="selectAvatar('${av}')">${av}</div>
  `).join('');
  document.getElementById('avatarModal').classList.remove('hidden');
}

function closeAvatarModal() {
  haptic();
  document.getElementById('avatarModal').classList.add('hidden');
}

function selectAvatar(av) {
  haptic();
  currentAvatar = av;
  localStorage.setItem("freezzzCurrentAvatar", av);
  document.getElementById('currentAvatarEmoji').textContent = av;
  closeAvatarModal();
}

// Темы
const themes = ["", "theme-matrix", "theme-fire"];
let currentThemeIdx = Number(localStorage.getItem("freezzzTheme") || 0);
applyTheme();
function toggleTheme() {
  currentThemeIdx = (currentThemeIdx + 1) % themes.length;
  localStorage.setItem("freezzzTheme", currentThemeIdx);
  applyTheme();
}
function applyTheme() {
  document.getElementById('bodyRoot').className = themes[currentThemeIdx] || "";
}

// Звук / Вибрация
let soundEnabled = localStorage.getItem("freezzzSound") !== "false";
updateSoundBtn();
function toggleSound() {
  soundEnabled = !soundEnabled;
  localStorage.setItem("freezzzSound", soundEnabled);
  updateSoundBtn();
}
function updateSoundBtn() {
  document.getElementById('soundToggle').textContent = soundEnabled ? "🔊" : "🔇";
}
function haptic() {
  if (soundEnabled && tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}

const gameFiles = ["snake.html", "tetris.html", "pong.html", "race.html", "mario.html", "arkanoid.html", "duck.html", "invaders.html", "doodle.html", "minesweeper.html"];
function playRandomGame() {
  haptic();
  window.location.href = gameFiles[Math.floor(Math.random() * gameFiles.length)];
}

function sharePortal() {
  haptic();
  const botUrl = "https://t.me/" + (tg.initDataUnsafe && tg.initDataUnsafe.bot ? tg.initDataUnsafe.bot.username : "your_bot_username");
  const shareText = "🕹️ Крутой аркадный кабинет FREEzzzGames! 10 ретро-игр:";
  if (tg.openTelegramLink) tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(botUrl)}&text=${encodeURIComponent(shareText)}`);
  else window.open(`https://t.me/share/url?url=${encodeURIComponent(botUrl)}&text=${encodeURIComponent(shareText)}`);
}
</script>
</body>
</html>
