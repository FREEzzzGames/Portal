<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{
  padding:10px;display:flex;justify-content:center;align-items:center;
  background: 
    radial-gradient(circle at 50% 20%, rgba(41, 16, 95, 0.8) 0%, rgba(7, 9, 34, 0.9) 50%, rgba(1, 2, 8, 0.95) 100%),
    linear-gradient(0deg, rgba(0,0,0,0.4), rgba(0,0,0,0.4));
  position: relative;
}

/* ФОНОВЫЕ СИЛУЭТЫ АВТОМАТОВ И ГЕЙМПАДА (8-bit Neon Style) */
body::before {
  content: "🕹️ 🎰 🕹️";
  position: absolute;
  top: 10px;
  left: 0; right: 0;
  text-align: center;
  font-size: 70px;
  opacity: 0.07;
  letter-spacing: 40px;
  pointer-events: none;
  filter: drop-shadow(0 0 15px #20e8ff);
}
body::after {
  content: "👾 🎮 🎰";
  position: absolute;
  bottom: 10px;
  left: 0; right: 0;
  text-align: center;
  font-size: 70px;
  opacity: 0.07;
  letter-spacing: 40px;
  pointer-events: none;
  filter: drop-shadow(0 0 15px #e52225);
}

.portal{
  width:min(450px,100%);text-align:center;display:flex;flex-direction:column;gap:12px;
  max-height:100%;overflow-y:auto;padding:10px;z-index:10;
  background: rgba(4, 7, 20, 0.75);
  border: 2px solid rgba(32, 232, 255, 0.3);
  border-radius: 18px;
  box-shadow: 0 0 30px rgba(21, 60, 255, 0.25), inset 0 0 20px rgba(0, 217, 255, 0.1);
  backdrop-filter: blur(6px);
}

h1{
  color:#ffd52c;font-size:24px;margin:5px 0 0;
  text-shadow:3px 3px #e52225, 0 0 15px #ffd52c88;
  letter-spacing:2px;
}
.subtitle {
  color: #20e8ff; font-size: 10px; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 5px;
  text-shadow: 0 0 8px #20e8ffaa;
}

/* СЕТКА ИКОНОК 3x4 */
.grid-menu{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;padding:5px;}

.icon-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  aspect-ratio:1/1;border:2px solid #20e8ff;border-radius:12px;
  background:rgba(6, 10, 27, 0.9);color:#fff;text-decoration:none;
  box-shadow:0 0 12px #00d9ff33;transition:.15s;padding:6px;gap:4px;
}
.icon-btn:active{transform:scale(.94);background:#0f2766;border-color:#ffd42a;}

.icon-emoji{font-size:26px;filter:drop-shadow(0 0 8px rgba(32,232,255,0.6));}
.icon-title{
  font-size:10px;font-weight:bold;color:#ffd52c;text-align:center;
  line-height:1.1;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}

.footer-info{color:#83a4c9;font-size:9px;margin-top:2px;letter-spacing:1px;}
</style>
</head>
<body>
<div class="portal">
  <div>
    <h1>FREEzzzGames</h1>
    <div class="subtitle">ARCADE PORTAL 🕹️</div>
  </div>
  
  <div class="grid-menu">
    <!-- 1. Утки -->
    <a href="duck.html" class="icon-btn">
      <div class="icon-emoji">🦆</div>
      <div class="icon-title">DUCK MUDACK</div>
    </a>

    <!-- 2. Гонки -->
    <a href="race.html" class="icon-btn">
      <div class="icon-emoji">🏎️</div>
      <div class="icon-title">RETRO RACER</div>
    </a>

    <!-- 3. Тетрис -->
    <a href="tetris.html" class="icon-btn">
      <div class="icon-emoji">🧱</div>
      <div class="icon-title">TETRIS CLASSIC</div>
    </a>

    <!-- 4. Змейка -->
    <a href="snake.html" class="icon-btn">
      <div class="icon-emoji">🐍</div>
      <div class="icon-title">SNAKE</div>
    </a>

    <!-- 5. Марио -->
    <a href="mario.html" class="icon-btn">
      <div class="icon-emoji">🍄</div>
      <div class="icon-title">PLATFORMER</div>
    </a>
  </div>

  <div class="footer-info">ВЫБЕРИ АРКАДУ ДЛЯ ЗАПУСКА</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
</script>
</body>
</html>
