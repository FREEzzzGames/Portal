<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg-grad: radial-gradient(circle at 50% 20%, rgba(41, 16, 95, 0.9) 0%, rgba(7, 9, 34, 0.95) 50%, rgba(1, 2, 8, 1) 100%);
  --portal-bg: rgba(4, 7, 20, 0.92);
  --border-col: rgba(32, 232, 255, 0.4);
  --accent-col: #20e8ff;
  --title-col: #ffd52c;
  --btn-bg: rgba(10, 16, 40, 0.95);
  --btn-hover: #16368a;
}
body.theme-matrix {
  --bg-grad: radial-gradient(circle at 50% 20%, rgba(10, 45, 20, 0.9) 0%, rgba(5, 20, 10, 0.95) 50%, rgba(1, 5, 2, 1) 100%);
  --portal-bg: rgba(4, 20, 10, 0.92);
  --border-col: rgba(0, 255, 136, 0.4);
  --accent-col: #00ff88;
  --title-col: #00ff88;
  --btn-bg: rgba(8, 30, 15, 0.95);
  --btn-hover: #134a2e;
}
body.theme-fire {
  --bg-grad: radial-gradient(circle at 50% 20%, rgba(65, 15, 10, 0.9) 0%, rgba(25, 7, 5, 0.95) 50%, rgba(8, 2, 1, 1) 100%);
  --portal-bg: rgba(20, 6, 4, 0.92);
  --border-col: rgba(255, 100, 30, 0.4);
  --accent-col: #ff6b30;
  --title-col: #ffd52c;
  --btn-bg: rgba(30, 10, 8, 0.95);
  --btn-hover: #7b1717;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{
  padding:6px;display:flex;justify-content:center;align-items:center;
  background: var(--bg-grad); position: fixed; inset: 0;
}
.portal{
  width: 100%; height: 100%; max-width: 480px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; gap: 8px;
  overflow-y: auto; padding: 10px; z-index: 10;
  background: var(--portal-bg); border: 2px solid var(--border-col);
  border-radius: 12px; box-shadow: 0 0 25px rgba(0,0,0,0.8);
}
.hidden { display: none !important; }

/* ШАПКА */
.header-top { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; gap: 6px; flex-shrink: 0; }
.profile-box { font-size: 11px; color: var(--accent-col); text-align: left; display: flex; align-items: center; gap: 6px; background: var(--btn-bg); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border-col); cursor: pointer; }
.user-avatar { width: 26px; height: 26px; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 15px; border: 1px solid var(--accent-col); flex-shrink: 0; }
.header-btns { display: flex; gap: 6px; }
.top-btn { background: var(--btn-bg); border: 1px solid var(--border-col); color: var(--title-col); padding: 6px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; }

h1{ color: var(--title-col); font-size: 24px; margin: 2px 0 0; text-shadow: 2px 2px #e52225; letter-spacing: 2px; }
.subtitle { color: var(--accent-col); font-size: 10px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }

/* КНОПКИ НАВИГАЦИИ */
.actions-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 4px; flex-wrap: wrap; flex-shrink: 0; }
.action-btn { background: var(--btn-bg); border: 2px solid var(--border-col); color: #83a4c9; padding: 8px 10px; border-radius: 8px; font: bold 10px monospace; cursor: pointer; transition: .2s; display: flex; align-items: center; gap: 4px; }
.action-btn.active { background: var(--btn-hover); border-color: var(--accent-col); color: var(--title-col); }
.action-btn.special { border-color: #ffd42aaa; color: #ffd42a; }

/* СЕТКА ИКОНОК 3x4 */
.grid-menu { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; padding: 4px; flex-grow: 1; }
.panel-view { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; overflow-y: auto; padding: 4px; }
.icon-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; aspect-ratio: 1/1; border: 2px solid var(--accent-col); border-radius: 14px; background: var(--btn-bg); color: #fff; text-decoration: none; cursor: pointer; box-shadow: 0 0 12px rgba(0,0,0,0.5); transition: .15s; padding: 8px; gap: 4px; }
.icon-btn:active { transform: scale(.93); background: var(--btn-hover); border-color: var(--title-col); }
.icon-emoji { font-size: 34px; filter: drop-shadow(0 0 6px var(--accent-col)); }
.icon-title { font-size: 11px; font-weight: bold; color: var(--title-col); text-align: center; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* МОДАЛЬНОЕ ОКНО АВАТАРОВ */
.modal-overlay { position: absolute; inset: 0; background: rgba(2,3,11,0.88); z-index: 100; display: flex; justify-content: center; align-items: center; padding: 15px; }
.modal-card { background: var(--portal-bg); border: 2px solid var(--accent-col); border-radius: 12px; width: 100%; max-width: 340px; padding: 14px; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.9); display: flex; flex-direction: column; gap: 8px; }
.avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-height: 200px; overflow-y: auto; padding: 2px; }
.avatar-item { aspect-ratio: 1/1; background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 22px; cursor: pointer; }
.avatar-item.active { border-color: var(--title-col); box-shadow: 0 0 8px var(--title-col); }

.footer-info { color: #83a4c9; font-size: 9px; letter-spacing: 1px; margin-top: auto; padding: 4px; flex-shrink: 0; }
</style>
</head>
<body id="bodyRoot">
<div class="portal">
  <div class="header-top">
    <div class="profile-box" id="userProfileBox" onclick="openAvatarModal()">
      <div class="user-avatar" id="currentAvatarEmoji">👾</div>
      <div id="userNameTxt">Игрок</div>
    </div>
    <div class="header-btns">
      <button class="top-btn" onclick="toggleTheme()" title="Тема">🎨</button>
      <button class="top-btn" id="soundToggle" onclick="toggleSound()">🔊</button>
    </div>
  </div>

  <div>
    <h1>FREEzzzGames</h1>
    <div class="subtitle">ARCADE PORTAL 🕹️</div>
  </div>

  <div class="actions-row">
    <button class="action-btn active" id="tabGames" onclick="switchTab('games')">🎮 ИГРЫ</button>
    <button class="action-btn special" onclick="playRandomGame()">🎲 РАНДОМ</button>
    <button class="action-btn" onclick="sharePortal()">📤 ДРУЗЬЯМ</button>
  </div>
  
  <!-- Сетка 3x4 (прямые ссылки на твои отдельные файлы игр) -->
  <div class="grid-menu" id="gamesGrid">
    <a href="snake.html" class="icon-btn"><div class="icon-emoji">🐍</div><div class="icon-title">SNAKE</div></a>
    <a href="tetris.html" class="icon-btn"><div class="icon-emoji">🧱</div><div class="icon-title">TETRIS</div></a>
    <a href="pong.html" class="icon-btn"><div class="icon-emoji">🏓</div><div class="icon-title">PONG</div></a>
    <a href="race.html" class="icon-btn"><div class="icon-emoji">🏎️</div><div class="icon-title">RACER</div></a>
    <a href="mario.html" class="icon-btn"><div class="icon-emoji">🍄</div><div class="icon-title">PLATFORMER</div></div>
    <a href="arkanoid.html" class="icon-btn"><div class="icon-emoji">🧱</div><div class="icon-title">ARKANOID</div></div>
    <a href="duck.html" class="icon-btn"><div class="icon-emoji">🦆</div><div class="icon-title">DUCK MUDACK</div></div>
    <a href="invaders.html" class="icon-btn"><div class="icon-emoji">👾</div><div class="icon-title">INVADERS</div></div>
    <a href="doodle.html" class="icon-btn"><div class="icon-emoji">🦘</div><div class="icon-title">JUMPER</div></div>
    <a href="minesweeper.html" class="icon-btn"><div class="icon-emoji">💣</div><div class="icon-title">MINESWEEPER</div></div>
    <div class="icon-btn" style="opacity:0.6;"><div class="icon-emoji">⏳</div><div class="icon-title">SOON...</div></div>
    <div class="icon-btn" style="opacity:0.6;"><div class="icon-emoji">⏳</div><div class="icon-title">SOON...</div></div>
  </div>

  <div class="footer-info">FREEzzzGames • ARCADE HUB</div>
</div>

<!-- МОДАЛЬНОЕ ОКНО АВАТАРОВ -->
<div class="modal-overlay hidden" id="avatarModal">
  <div class="modal-card">
    <h3 style="color:var(--title-col); margin:0; font-size:14px;">КОЛЛЕКЦИЯ АВАТАРОВ</h3>
    <p style="font-size:9px; color:#83a4c9; margin:0;">Выбирай собранную аватарку или заходи ежедневно за новой!</p>
    <div class="avatar-grid" id="avatarGrid"></div>
    <button class="action-btn" style="width:100%; justify-content:center; padding:8px; margin-top:2px;" onclick="closeAvatarModal()">ЗАКРЫТЬ</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
let userName = "Игрок";
if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) {
  userName = tg.initDataUnsafe.user.first_name;
}
document.getElementById('userNameTxt').textContent = userName;

// АВАТАРЫ
const possibleAvatars = ["👾", "🤖", "👽", "🦊", "🐯", "🐼", "🦄", "🐲", "👻", "💀", "👑", "🚀", "⚡", "💎", "🕹️", "🔥"];
let userAvatars = JSON.parse(localStorage.getItem("freezzzAvatars") || '["👾"]');
let currentAvatar = localStorage.getItem("freezzzCurrentAvatar") || userAvatars[0];

const todayStr = new Date().toDateString();
if (localStorage.getItem("freezzzLastAvatarDate") !== todayStr) {
  const randomNew = possibleAvatars[Math.floor(Math.random() * possibleAvatars.length)];
  if (!userAvatars.includes(randomNew)) {
    userAvatars.push(randomNew);
    localStorage.setItem("freezzzAvatars", JSON.stringify(userAvatars));
  }
  localStorage.setItem("freezzzLastAvatarDate", todayStr);
}
document.getElementById('currentAvatarEmoji').textContent = currentAvatar;

function openAvatarModal() {
  haptic();
  const grid = document.getElementById('avatarGrid');
  grid.innerHTML = userAvatars.map(av => `
    <div class="avatar-item ${av === currentAvatar ? 'active' : ''}" onclick="selectAvatar('${av}')">${av}</div>
  `).join('');
  document.getElementById('avatarModal').classList.remove('hidden');
}

function closeAvatarModal() {
  haptic();
  document.getElementById('avatarModal').classList.add('hidden');
}

function selectAvatar(av) {
  haptic();
  currentAvatar = av;
  localStorage.setItem("freezzzCurrentAvatar", av);
  document.getElementById('currentAvatarEmoji').textContent = av;
  closeAvatarModal();
}

// Темы
const themes = ["", "theme-matrix", "theme-fire"];
let currentThemeIdx = Number(localStorage.getItem("freezzzTheme") || 0);
applyTheme();
function toggleTheme() {
  currentThemeIdx = (currentThemeIdx + 1) % themes.length;
  localStorage.setItem("freezzzTheme", currentThemeIdx);
  applyTheme();
}
function applyTheme() {
  document.getElementById('bodyRoot').className = themes[currentThemeIdx] || "";
}

// Звук / Вибрация
let soundEnabled = localStorage.getItem("freezzzSound") !== "false";
updateSoundBtn();
function toggleSound() {
  soundEnabled = !soundEnabled;
  localStorage.setItem("freezzzSound", soundEnabled);
  updateSoundBtn();
}
function updateSoundBtn() {
  document.getElementById('soundToggle').textContent = soundEnabled ? "🔊" : "🔇";
}
function haptic() {
  if (soundEnabled && tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}

const gameFiles = ["snake.html", "tetris.html", "pong.html", "race.html", "mario.html", "arkanoid.html", "duck.html", "invaders.html", "doodle.html", "minesweeper.html"];
function playRandomGame() {
  haptic();
  window.location.href = gameFiles[Math.floor(Math.random() * gameFiles.length)];
}

function sharePortal() {
  haptic();
  const botUrl = "https://t.me/" + (tg.initDataUnsafe && tg.initDataUnsafe.bot ? tg.initDataUnsafe.bot.username : "your_bot_username");
  const shareText = "🕹️ Крутой аркадный портал FREEzzzGames! 10 ретро-игр:";
  if (tg.openTelegramLink) tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(botUrl)}&text=${encodeURIComponent(shareText)}`);
  else window.open(`https://t.me/share/url?url=${encodeURIComponent(botUrl)}&text=${encodeURIComponent(shareText)}`);
}
</script>
</body>
    </html>
