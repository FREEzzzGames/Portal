<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{
  padding:8px;display:flex;justify-content:center;align-items:center;
  background: radial-gradient(circle at 50% 20%, rgba(41, 16, 95, 0.8) 0%, rgba(7, 9, 34, 0.9) 50%, rgba(1, 2, 8, 0.95) 100%);
  position: relative;
}
body::before {
  content: "🕹️ 🎰 🕹️"; position: absolute; top: 5px; left: 0; right: 0;
  text-align: center; font-size: 50px; opacity: 0.05; letter-spacing: 30px; pointer-events: none;
}
.portal{
  width:min(460px,100%);text-align:center;display:flex;flex-direction:column;gap:8px;
  max-height:100%;overflow-y:auto;padding:8px;z-index:10;
  background: rgba(4, 7, 20, 0.85);
  border: 2px solid rgba(32, 232, 255, 0.3);
  border-radius: 16px;
  box-shadow: 0 0 30px rgba(21, 60, 255, 0.25);
}
h1{
  color:#ffd52c;font-size:22px;margin:3px 0 0;
  text-shadow:2px 2px #e52225, 0 0 12px #ffd52c88; letter-spacing:2px;
}
.subtitle {
  color: #20eaff; font-size: 9px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 2px;
}

/* КНОПКА ПЕРЕКЛЮЧЕНИЯ ВКЛАДОК */
.tabs {
  display: flex; gap: 6px; justify-content: center; margin-bottom: 2px;
}
.tab-btn {
  background: rgba(6, 10, 27, 0.9); border: 2px solid #20e8ff55; color: #83a4c9;
  padding: 6px 12px; border-radius: 8px; font: bold 10px monospace; cursor: pointer; transition: .2s;
}
.tab-btn.active {
  background: #0f2766; border-color: #20e8ff; color: #ffd52c;
  box-shadow: 0 0 10px #00d9ff33;
}

/* СЕТКА ИКОНОК */
.grid-menu{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;padding:2px;}
.grid-menu.hidden { display: none; }

.icon-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  aspect-ratio:1/1;border:2px solid #20e8ff;border-radius:10px;
  background:rgba(6, 10, 27, 0.9);color:#fff;text-decoration:none;
  box-shadow:0 0 10px #00d9ff22;transition:.15s;padding:4px;gap:2px;
}
.icon-btn:active{transform:scale(.94);background:#0f2766;border-color:#ffd42a;}
.icon-emoji{font-size:24px;filter:drop-shadow(0 0 6px rgba(32,232,255,0.6));}
.icon-title{
  font-size:9px;font-weight:bold;color:#ffd52c;text-align:center;
  line-height:1.1;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}

/* ТАБЛИЦА ЛИДЕРОВ */
.leaderboard {
  display: flex; flex-direction: column; gap: 5px; padding: 2px; max-height: 280px; overflow-y: auto;
}
.leaderboard.hidden { display: none; }
.score-row {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(6, 10, 27, 0.9); border: 1px solid #20e8ff33; border-radius: 8px;
  padding: 8px 12px; font-size: 11px;
}
.score-name { color: #20eaff; display: flex; align-items: center; gap: 6px; }
.score-val { color: #ffd52c; font-weight: bold; }

.footer-info{color:#83a4c9;font-size:8px;letter-spacing:1px;margin-top:2px;}
</style>
</head>
<body>
<div class="portal">
  <div>
    <h1>FREEzzzGames</h1>
    <div class="subtitle">ARCADE PORTAL 🕹️</div>
  </div>

  <!-- Кнопки переключения: Игры / Топ -->
  <div class="tabs">
    <button class="tab-btn active" id="tabGames" onclick="switchTab('games')">🎮 АРКАДЫ</button>
    <button class="tab-btn" id="tabTop" onclick="switchTab('top')">🏆 ТОП ИГРОКОВ</button>
  </div>
  
  <!-- Сетка игр -->
  <div class="grid-menu" id="gamesGrid">
    <a href="duck.html" class="icon-btn"><div class="icon-emoji">🦆</div><div class="icon-title">DUCK MUDACK</div></a>
    <a href="race.html" class="icon-btn"><div class="icon-emoji">🏎️</div><div class="icon-title">RETRO RACER</div></a>
    <a href="tetris.html" class="icon-btn"><div class="icon-emoji">🧱</div><div class="icon-title">TETRIS</div></a>
    <a href="snake.html" class="icon-btn"><div class="icon-emoji">🐍</div><div class="icon-title">SNAKE</div></a>
    <a href="mario.html" class="icon-btn"><div class="icon-emoji">🍄</div><div class="icon-title">PLATFORMER</div></a>
    <a href="pong.html" class="icon-btn"><div class="icon-emoji">🏓</div><div class="icon-title">PONG</div></a>
    <a href="arkanoid.html" class="icon-btn"><div class="icon-emoji">🧱</div><div class="icon-title">ARKANOID</div></a>
    <a href="invaders.html" class="icon-btn"><div class="icon-emoji">👾</div><div class="icon-title">INVADERS</div></a>
    <a href="doodle.html" class="icon-btn"><div class="icon-emoji">🦘</div><div class="icon-title">JUMPER</div></a>
    <a href="minesweeper.html" class="icon-btn"><div class="icon-emoji">💣</div><div class="icon-title">MINESWEEPER</div></a>
  </div>

  <!-- Таблица рекордов (Топ) -->
  <div class="leaderboard hidden" id="leaderboardView">
    <div class="score-row"><span class="score-name">🦆 Duck Mudack</span><span class="score-val" id="scoreDuck">0</span></div>
    <div class="score-row"><span class="score-name">🏎️ Retro Racer (Круг)</span><span class="score-val" id="scoreRace">--.--</span></div>
    <div class="score-row"><span class="score-name">🧱 Tetris Classic</span><span class="score-val" id="scoreTetris">0</span></div>
    <div class="score-row"><span class="score-name">🐍 Classic Snake</span><span class="score-val" id="scoreSnake">0</span></div>
    <div class="score-row"><span class="score-name">🍄 Super Platformer</span><span class="score-val" id="scorePlatformer">0</span></div>
    <div class="score-row"><span class="score-name">🦘 Retro Jumper</span><span class="score-val" id="scoreJumper">0</span></div>
  </div>

  <div class="footer-info">ВЫБЕРИ ИГРУ ИЛИ ПРОВЕРЬ РЕКОРДЫ</div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();

function switchTab(tab) {
  const gamesGrid = document.getElementById('gamesGrid');
  const lbView = document.getElementById('leaderboardView');
  const tabGames = document.getElementById('tabGames');
  const tabTop = document.getElementById('tabTop');

  if (tab === 'games') {
    gamesGrid.classList.remove('hidden');
    lbView.classList.add('hidden');
    tabGames.classList.add('active');
    tabTop.classList.remove('active');
  } else {
    gamesGrid.classList.add('hidden');
    lbView.classList.remove('hidden');
    tabTop.classList.add('active');
    tabGames.classList.remove('active');
    loadScores();
  }
}

function loadScores() {
  document.getElementById('scoreDuck').textContent = localStorage.getItem("duckMudackHighScore") || "0";
  let bestLap = localStorage.getItem("f1WallBestLap") || localStorage.getItem("retroBestLap");
  document.getElementById('scoreRace').textContent = bestLap ? Number(bestLap).toFixed(2) + "s" : "--.--";
  document.getElementById('scoreTetris').textContent = localStorage.getItem("tetrisHighScore") || "0";
  document.getElementById('scoreSnake').textContent = localStorage.getItem("snakeHighScore") || "0";
  document.getElementById('scorePlatformer').textContent = localStorage.getItem("platformerBest") || "0";
  document.getElementById('scoreJumper').textContent = localStorage.getItem("doodleBest") || "0";
}
</script>
</body>
</html>
