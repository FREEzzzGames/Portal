<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARKANOID — FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{padding:6px;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 0,#29105f 0%,#070922 35%,#010208 85%);}
.arcade{width:min(500px,100%);height:100%;max-height:750px;border:3px solid #151a32;border-radius:16px;background:#070a15;display:flex;flex-direction:column;}
.marquee{padding:8px;text-align:center;background:#070925;border-bottom:3px solid #121936;}
.marquee h1{margin:0;font-size:20px;color:#ffd52c;text-shadow:2px 2px #e52225;}
.screen-wrapper{flex-grow:1;position:relative;background:#03050c;display:flex;justify-content:center;align-items:center;padding:10px;}
canvas{background:#010206;border:2px solid #20e8ff;border-radius:6px;width:100%;height:100%;object-fit:contain;}
.controls{display:flex;justify-content:space-around;padding:10px;background:#070a18;border-top:3px solid #141c38;gap:10px;}
.ctrl-btn{flex-grow:1;height:55px;border:2px solid rgba(255,255,255,.3);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:22px;display:flex;justify-content:center;align-items:center;user-select:none;cursor:pointer;}
.ctrl-btn:active{background:rgba(32,232,255,.35);border-color:#20e8ff;}
.overlay{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:#02030be8;}
.overlay.hidden{display:none;}
.card{width:min(320px,90%);padding:18px;border:3px solid #20e8ff;border-radius:12px;background:#060a1bef;text-align:center;}
.card h2{margin:0 0 8px;color:#ffd42a;font-size:20px;}
.card p{color:#b8eaff;font-size:12px;}
.start-btn{margin-top:12px;width:100%;height:40px;border:2px solid #20e8ff;border-radius:6px;background:#0f2766;color:#fff;font:bold 13px monospace;cursor:pointer;}
.bottom{padding:4px;text-align:center;border-top:2px solid #111a3b;color:#ffd52c;font-size:10px;background:#050716;}
</style>
</head>
<body>
<div class="arcade">
  <div class="marquee"><h1>ARKANOID 🧱</h1></div>
  <div class="screen-wrapper"><canvas id="arkanoid" width="400" height="500"></canvas></div>
  <div class="controls">
    <div class="ctrl-btn" id="btnLeft">◄</div>
    <div class="ctrl-btn" id="btnRight">►</div>
  </div>
  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="title">ARKANOID</h2>
      <p>Разбей все блоки мячом!<br><br>Управляй платформой кнопками.</p>
      <button class="start-btn" id="startBtn">СТАРТ</button>
    </div>
  </div>
  <footer class="bottom">УНИЧТОЖЬ БЛОКИ</footer>
</div>
<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const canvas = document.getElementById('arkanoid'), ctx = canvas.getContext('2d');
let running = false, dir = 0;
let paddle = {x: 160, y: 460, w: 80, h: 12, speed: 6};
let ball = {x: 200, y: 300, r: 6, vx: 3, vy: -3};
let bricks = [];

function initBricks() {
  bricks = [];
  let colors = ['#e52225', '#ffd52c', '#20e8ff', '#00ff88'];
  for(let r=0; r<4; r++) {
    for(let c=0; c<8; c++) {
      bricks.push({x: c * 48 + 10, y: r * 22 + 25, w: 44, h: 16, status: 1, color: colors[r]});
    }
  }
}

function update() {
  if (!running) return;
  paddle.x += dir * paddle.speed;
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x > canvas.width - paddle.w) paddle.x = canvas.width - paddle.w;

  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.x - ball.r < 0 || ball.x + ball.r > canvas.width) ball.vx *= -1;
  if (ball.y - ball.r < 0) ball.vy *= -1;

  if (ball.y + ball.r > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
    ball.vy *= -1;
    let hitPoint = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
    ball.vx = hitPoint * 4;
  }

  if (ball.y > canvas.height) {
    running = false;
    showOver("ИГРА ОКОНЧЕНА");
  }

  let activeBricks = 0;
  bricks.forEach(b => {
    if (b.status === 1) {
      activeBricks++;
      if (ball.x > b.x && ball.x < b.x + b.w && ball.y > b.y && ball.y < b.y + b.h) {
        b.status = 0; ball.vy *= -1;
      }
    }
  });

  if (activeBricks === 0) {
    running = false;
    showOver("ПОБЕДА!");
  }
}

function showOver(text) {
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('title').textContent = text;
  document.getElementById('startBtn').textContent = "ЕЩЕ РАЗ";
}

function draw() {
  ctx.fillStyle = '#010206'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#20e8ff'; ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  ctx.fillStyle = '#ffd52c'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
  bricks.forEach(b => {
    if (b.status === 1) {
      ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#000'; ctx.strokeRect(b.x, b.y, b.w, b.h);
    }
  });
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

document.getElementById('btnLeft').addEventListener('pointerdown', () => dir = -1);
document.getElementById('btnLeft').addEventListener('pointerup', () => dir = 0);
document.getElementById('btnRight').addEventListener('pointerdown', () => dir = 1);
document.getElementById('btnRight').addEventListener('pointerup', () => dir = 0);
document.getElementById('startBtn').addEventListener('click', () => {
  paddle.x = 160; ball.x = 200; ball.y = 300; ball.vx = 3; ball.vy = -3;
  initBricks(); running = true;
  document.getElementById('overlay').classList.add('hidden');
});
loop();
</script>
</body>
</html>
