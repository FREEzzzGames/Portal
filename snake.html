<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake — FREEzzzGames</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg-grad: radial-gradient(circle at 50% 20%, rgba(41, 16, 95, 0.9) 0%, rgba(7, 9, 34, 0.95) 50%, rgba(1, 2, 8, 1) 100%);
  --portal-bg: rgba(4, 7, 20, 0.92);
  --border-col: rgba(32, 232, 255, 0.4);
  --accent-col: #20e8ff;
  --title-col: #ffd52c;
  --btn-bg: rgba(16, 26, 60, 0.95);
  --btn-hover: #213c8f;
  --glass-bg: rgba(32, 232, 255, 0.08);
  --neon-glow: rgba(32, 232, 255, 0.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:#02030b;color:#fff;font-family:monospace;overflow:hidden;}
body{
  padding:4px;display:flex;justify-content:center;align-items:center;
  background: var(--bg-grad); position: fixed; inset: 0;
}
.portal{
  width: 100%; height: 100%; max-width: 420px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; gap: 6px;
  overflow-y: auto; padding: 8px; z-index: 10;
  background: var(--portal-bg); border: 2px solid var(--border-col);
  border-radius: 12px; box-shadow: 0 0 25px rgba(0,0,0,0.8);
  position: relative;
}
.game-ui-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 8px; width: 100%; flex-shrink: 0; }

#gameContainer { flex-grow: 1; width: 100%; position: relative; background: #010206; border: 2px solid var(--accent-col); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
canvas { width: 100%; height: 100%; object-fit: contain; background: #010206; }

/* УВЕЛИЧЕННЫЕ И МЯГКИЕ КНОПКИ УПРАВЛЕНИЯ */
.game-controls { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; padding: 4px; flex-shrink: 0; }
.dpad-row { display: flex; gap: 8px; justify-content: center; }
.ctrl-pad-btn { 
  background: var(--glass-bg); backdrop-filter: blur(4px);
  border: 2px solid var(--accent-col); color: var(--title-col); 
  font-size: 24px; width: 75px; height: 60px; border-radius: 10px; 
  display: flex; justify-content: center; align-items: center; 
  cursor: pointer; user-select: none; box-shadow: 0 0 10px var(--neon-glow); 
  transition: transform 0.1s;
}
.ctrl-pad-btn:active { background: var(--btn-hover); transform: scale(0.92); border-color: var(--title-col); }
</style>
</head>
<body>

<!-- УНИВЕРСАЛЬНАЯ ПЛАВАЮЩАЯ КНОПКА ВОЗВРАТА В МЕНЮ -->
<div style="position: fixed; top: 10px; left: 10px; z-index: 99999;">
  <a href="index.html" style="display: flex; align-items: center; gap: 4px; background: rgba(140, 5, 5, 0.95); border: 2px solid #ff6b55; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-family: monospace; font-size: 11px; font-weight: bold; box-shadow: 0 0 15px rgba(255,0,0,0.7); -webkit-tap-highlight-color: transparent;">
    ⬅ МЕНЮ
  </a>
</div>

<div class="portal">
  <div class="game-ui-header">
    <div style="width: 50px;"></div>
    <div style="color:var(--title-col); font-size:13px; font-weight:bold;" id="scoreTxt">СЧЕТ: 0</div>
    <div style="width: 50px;"></div>
  </div>

  <div id="gameContainer">
    <canvas id="gCanvas" width="400" height="400"></canvas>
  </div>

  <!-- КРУПНЫЙ И УДОБНЫЙ ДУХОВЫЙ ДПАД -->
  <div class="game-controls">
    <button class="ctrl-pad-btn" id="sUp">▲</button>
    <div class="dpad-row">
      <button class="ctrl-pad-btn" id="sLeft">◀</button>
      <button class="ctrl-pad-btn" id="sDown">▼</button>
      <button class="ctrl-pad-btn" id="sRight">▶</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
let soundEnabled = localStorage.getItem("freezzzSound") !== "false";
function haptic() {
  if (soundEnabled && tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
  }
}

const canvas = document.getElementById('gCanvas');
const ctx = canvas.getContext('2d');
const gs = 20, tc = 20;

let snake = [{x:10, y:10}, {x:9, y:10}];
let food = {x:5, y:5};
let dx = 1, dy = 0;
let nextDx = 1, nextDy = 0; // Буфер направления для плавного поворота без багов
let score = 0;

function spawnFood() {
  food.x = Math.floor(Math.random() * tc);
  food.y = Math.floor(Math.random() * tc);
}
spawnFood();

function gameLoop() {
  // Применяем направление из буфера (гарантирует плавность и отсутствие быстрых разворотов в себя)
  dx = nextDx;
  dy = nextDy;

  let head = {x: snake[0].x + dx, y: snake[0].y + dy};

  // Проход сквозь стены
  if (head.x < 0) head.x = tc - 1;
  else if (head.x >= tc) head.x = 0;
  if (head.y < 0) head.y = tc - 1;
  else if (head.y >= tc) head.y = 0;

  // Столкновение с собой
  for (let p of snake) {
    if (head.x === p.x && head.y === p.y) {
      let best = Number(localStorage.getItem("snakeHighScore") || 0);
      if (score > best) localStorage.setItem("snakeHighScore", score);
      alert("Игра окончена! Счёт: " + score);
      score = 0;
      snake = [{x:10, y:10}, {x:9, y:10}];
      dx = 1; dy = 0; nextDx = 1; nextDy = 0;
      spawnFood();
      document.getElementById('scoreTxt').textContent = "СЧЕТ: " + score;
      return;
    }
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('scoreTxt').textContent = "СЧЕТ: " + score;
    spawnFood();
    haptic();
  } else {
    snake.pop();
  }

  // Отрисовка
  ctx.fillStyle = '#010206';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Еда (неоновое яблоко)
  ctx.fillStyle = '#ff3366';
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#ff3366';
  ctx.fillRect(food.x * gs + 1, food.y * gs + 1, gs - 2, gs - 2);

  // Змейка
  snake.forEach((p, i) => {
    ctx.fillStyle = i === 0 ? '#20e8ff' : '#00bfff';
    ctx.shadowBlur = i === 0 ? 10 : 4;
    ctx.shadowColor = i === 0 ? '#20e8ff' : '#00bfff';
    ctx.fillRect(p.x * gs + 1, p.y * gs + 1, gs - 2, gs - 2);
  });
  ctx.shadowBlur = 0;
}

setInterval(gameLoop, 120); // Плавная и комфортная скорость

// Плавное управление с защитой от разворота на 180 градусов на месте
document.getElementById('sUp').addEventListener('pointerdown', () => {
  haptic();
  if (dy === 0) { nextDx = 0; nextDy = -1; }
});
document.getElementById('sDown').addEventListener('pointerdown', () => {
  haptic();
  if (dy === 0) { nextDx = 0; nextDy = 1; }
});
document.getElementById('sLeft').addEventListener('pointerdown', () => {
  haptic();
  if (dx === 0) { nextDx = -1; nextDy = 0; }
});
document.getElementById('sRight').addEventListener('pointerdown', () => {
  haptic();
  if (dx === 0) { nextDx = 1; nextDy = 0; }
});
</script>
</body>
</html>
